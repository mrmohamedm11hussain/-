<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>نصر ٦ أكتوبر — الفيلم التفاعلي</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#020305;
  font-family:Tahoma,Arial,sans-serif;
}

#app{
  position:fixed;
  inset:0;
  overflow:hidden;
  background:#020305;
}

canvas{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
}

#scene{z-index:1}
#effects{z-index:2;pointer-events:none}

.overlay{
  position:absolute;
  inset:0;
  z-index:5;
  pointer-events:none;
}

.vignette{
  position:absolute;
  inset:0;
  background:
    radial-gradient(
      ellipse at center,
      transparent 30%,
      rgba(0,0,0,.25) 65%,
      rgba(0,0,0,.9) 100%
    );
}

.noise{
  position:absolute;
  inset:-100%;
  opacity:.08;
  background-image:
    repeating-radial-gradient(
      circle,
      #fff 0 1px,
      transparent 1px 4px
    );
  animation:noise .12s steps(2) infinite;
}

@keyframes noise{
  0%{transform:translate(0,0)}
  25%{transform:translate(2%,-1%)}
  50%{transform:translate(-1%,2%)}
  75%{transform:translate(1%,1%)}
  100%{transform:translate(-2%,-1%)}
}

.bar{
  position:absolute;
  left:0;
  width:100%;
  height:8vh;
  background:#000;
  z-index:20;
}
.bar.top{top:0}
.bar.bottom{bottom:0}

#intro{
  position:absolute;
  inset:0;
  z-index:50;
  display:flex;
  justify-content:center;
  align-items:center;
  text-align:center;
  background:#010204;
  transition:opacity 1.8s ease;
}

.introBox{
  animation:intro 2s ease forwards;
}

@keyframes intro{
  from{
    opacity:0;
    transform:scale(.94) translateY(25px)
  }
  to{
    opacity:1;
    transform:scale(1) translateY(0)
  }
}

.eyebrow{
  color:#b9a064;
  font-size:12px;
  letter-spacing:7px;
  margin-bottom:22px;
}

.introDate{
  font-size:clamp(55px,14vw,150px);
  font-weight:900;
  line-height:.8;
  color:#eee7d0;
  text-shadow:
    0 0 40px rgba(255,210,120,.12);
}

.introText{
  margin-top:30px;
  font-size:clamp(16px,3vw,27px);
  color:#bbb;
}

#start{
  margin-top:45px;
  padding:15px 42px;
  border-radius:50px;
  border:1px solid rgba(255,255,255,.25);
  color:#fff;
  background:rgba(255,255,255,.04);
  font-size:16px;
  cursor:pointer;
  transition:.3s;
  backdrop-filter:blur(10px);
}

#start:hover{
  background:rgba(255,255,255,.12);
  transform:scale(1.05);
}

#title{
  position:absolute;
  z-index:10;
  top:21%;
  left:50%;
  width:92%;
  text-align:center;
  transform:translate(-50%,20px);
  opacity:0;
  transition:
    opacity 1s ease,
    transform 1s ease;
}

#title.show{
  opacity:1;
  transform:translate(-50%,0);
}

.kicker{
  color:#d3b86b;
  font-size:clamp(10px,1.8vw,15px);
  letter-spacing:5px;
  margin-bottom:14px;
}

.mainTitle{
  font-size:clamp(32px,7vw,85px);
  font-weight:900;
  text-shadow:0 5px 30px #000;
}

.description{
  margin-top:15px;
  color:#d1d1d1;
  font-size:clamp(12px,2vw,19px);
}

#progress{
  position:absolute;
  z-index:15;
  left:50%;
  bottom:11%;
  transform:translateX(-50%);
  width:min(520px,65%);
  height:2px;
  background:rgba(255,255,255,.16);
}

#progress span{
  display:block;
  width:0;
  height:100%;
  background:#d7b867;
  box-shadow:0 0 12px #d7b867;
}

#counter{
  position:absolute;
  z-index:15;
  right:5%;
  bottom:11%;
  color:rgba(255,255,255,.5);
  font-size:11px;
  letter-spacing:3px;
}

#controls{
  position:absolute;
  z-index:30;
  left:5%;
  bottom:10%;
  display:flex;
  gap:8px;
  opacity:0;
  transition:.8s;
}

.ctrl{
  width:40px;
  height:40px;
  border-radius:50%;
  border:1px solid rgba(255,255,255,.22);
  background:rgba(0,0,0,.35);
  color:#fff;
  cursor:pointer;
  backdrop-filter:blur(8px);
}

#flash{
  position:absolute;
  inset:0;
  z-index:40;
  background:#fff;
  opacity:0;
  pointer-events:none;
}

#ending{
  position:absolute;
  inset:0;
  z-index:45;
  display:flex;
  justify-content:center;
  align-items:center;
  text-align:center;
  opacity:0;
  pointer-events:none;
  background:
    radial-gradient(
      circle,
      rgba(195,158,76,.15),
      rgba(0,0,0,.94) 72%
    );
  transition:opacity 2.5s;
}

#ending.show{
  opacity:1;
}

.endBox{
  transform:scale(.85);
  transition:transform 2.5s;
}

#ending.show .endBox{
  transform:scale(1);
}

.endTitle{
  font-size:clamp(48px,11vw,130px);
  font-weight:900;
  background:linear-gradient(#fff,#d8b85e);
  -webkit-background-clip:text;
  color:transparent;
}

.endLine{
  width:80px;
  height:2px;
  background:#d8b85e;
  margin:30px auto;
}

.endDate{
  color:#ddd;
  letter-spacing:5px;
  font-size:clamp(13px,2.5vw,22px);
}

.endSmall{
  color:#777;
  font-size:11px;
  margin-top:45px;
}

@media(max-width:600px){
  .bar{height:6vh}
}
</style>
</head>

<body>

<div id="app">

<canvas id="scene"></canvas>
<canvas id="effects"></canvas>

<div class="overlay">
  <div class="vignette"></div>
  <div class="noise"></div>
</div>

<div class="bar top"></div>
<div class="bar bottom"></div>

<!-- INTRO -->

<div id="intro">

  <div class="introBox">

    <div class="eyebrow">EGYPT • 1973</div>

    <div class="introDate">٦ أكتوبر</div>

    <div class="introText">
      حين عبرت الإرادة
    </div>

    <button id="start">
      ▶ ابدأ الفيلم
    </button>

  </div>

</div>

<!-- TITLES -->

<div id="title">

  <div class="kicker" id="kicker"></div>

  <div class="mainTitle" id="mainTitle"></div>

  <div class="description" id="description"></div>

</div>

<div id="progress">
  <span></span>
</div>

<div id="counter">
  00:00
</div>

<div id="controls">
  <button class="ctrl" id="sound">🔊</button>
  <button class="ctrl" id="again">↻</button>
</div>

<div id="flash"></div>

<!-- END -->

<div id="ending">

  <div class="endBox">

    <div class="endTitle">
      نصر أكتوبر
    </div>

    <div class="endLine"></div>

    <div class="endDate">
      السادس من أكتوبر ١٩٧٣
    </div>

    <div class="endSmall">
      ذكرى وطنية خالدة
    </div>

  </div>

</div>

</div>

<script>

/* =====================================================
   OCTOBER 6 — CINEMATIC ENGINE
===================================================== */

const canvas=document.getElementById("scene");
const fx=document.getElementById("effects");

const c=canvas.getContext("2d");
const f=fx.getContext("2d");

let W=innerWidth;
let H=innerHeight;
let DPR=Math.min(devicePixelRatio||1,2);

let running=false;
let muted=false;
let startTime=0;
let time=0;

const LENGTH=62;

let audio=null;

let smoke=[];
let sparks=[];
let rockets=[];


/* =====================================================
   RESIZE
===================================================== */

function resize(){

  W=innerWidth;
  H=innerHeight;

  canvas.width=W*DPR;
  canvas.height=H*DPR;

  fx.width=W*DPR;
  fx.height=H*DPR;

  c.setTransform(DPR,0,0,DPR,0,0);
  f.setTransform(DPR,0,0,DPR,0,0);
}

addEventListener("resize",resize);
resize();


/* =====================================================
   MATH
===================================================== */

const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;

function ease(t){
  return t*t*(3-2*t);
}

function rand(a,b){
  return a+Math.random()*(b-a);
}


/* =====================================================
   AUDIO
===================================================== */

function initAudio(){

  if(audio)return;

  try{
    const AC=
      window.AudioContext||
      window.webkitAudioContext;

    if(AC)audio=new AC();

  }catch(e){}
}

function sound(freq,duration,volume,type="sine"){

  if(!audio||muted)return;

  const o=audio.createOscillator();
  const g=audio.createGain();

  o.type=type;
  o.frequency.value=freq;

  g.gain.setValueAtTime(
    0,
    audio.currentTime
  );

  g.gain.linearRampToValueAtTime(
    volume,
    audio.currentTime+.04
  );

  g.gain.exponentialRampToValueAtTime(
    .001,
    audio.currentTime+duration
  );

  o.connect(g);
  g.connect(audio.destination);

  o.start();
  o.stop(audio.currentTime+duration);
}

function impact(){

  if(muted)return;

  sound(55,.9,.15,"sine");

  setTimeout(()=>{
    sound(90,.4,.07,"triangle");
  },80);
}


/* =====================================================
   TITLE SYSTEM
===================================================== */

const scenes=[

  {
    a:0,b:7,
    k:"السادس من أكتوبر",
    t:"حين بدأ التاريخ",
    d:"لحظة بقيت حاضرة في الذاكرة المصرية"
  },

  {
    a:7,b:17,
    k:"اللحظة الأولى",
    t:"سماءٌ تستعد",
    d:"هدوء يسبق لحظة تاريخية"
  },

  {
    a:17,b:28,
    k:"قناة السويس",
    t:"إلى الضفة الأخرى",
    d:"حين تحولت الإرادة إلى فعل"
  },

  {
    a:28,b:42,
    k:"أكتوبر ١٩٧٣",
    t:"الإرادة تتقدم",
    d:"مشهد من واحدة من أشهر صفحات التاريخ المصري"
  },

  {
    a:42,b:51,
    k:"مصر",
    t:"رايةٌ في السماء",
    d:"فخرٌ وذكرى لا تُنسى"
  },

  {
    a:51,b:62,
    k:"النهاية",
    t:"نصر أكتوبر",
    d:"السادس من أكتوبر ١٩٧٣"
  }

];

let sceneIndex=-1;

function updateTitle(t){

  let index=scenes.findIndex(
    s=>t>=s.a&&t<s.b
  );

  if(index<0)index=scenes.length-1;

  if(index===sceneIndex)return;

  sceneIndex=index;

  const s=scenes[index];
  const title=document.getElementById("title");

  title.classList.remove("show");

  setTimeout(()=>{

    document.getElementById("kicker").textContent=s.k;
    document.getElementById("mainTitle").textContent=s.t;
    document.getElementById("description").textContent=s.d;

    title.classList.add("show");

  },150);
}


/* =====================================================
   SKY
===================================================== */

function sky(t){

  let p=clamp(t/24,0,1);

  const r=Math.floor(3+38*p);
  const g=Math.floor(7+43*p);
  const b=Math.floor(15+35*p);

  const grad=c.createLinearGradient(0,0,0,H);

  grad.addColorStop(
    0,
    `rgb(${r},${g},${b})`
  );

  grad.addColorStop(
    .55,
    `rgb(${r+8},${g+9},${b+8})`
  );

  grad.addColorStop(
    1,
    `rgb(${r+18},${g+14},${b+8})`
  );

  c.fillStyle=grad;
  c.fillRect(0,0,W,H);
}


/* =====================================================
   STARS
===================================================== */

function stars(t){

  if(t>23)return;

  const alpha=1-clamp((t-16)/7,0,1);

  for(let i=0;i<130;i++){

    const x=(i*173)%W;
    const y=(i*67)%(H*.55);

    const pulse=
      .5+
      Math.sin(t*2+i)*.5;

    c.fillStyle=
      `rgba(255,255,255,${alpha*.15*pulse})`;

    c.fillRect(
      x,
      y,
      1.5,
      1.5
    );
  }
}


/* =====================================================
   MOON
===================================================== */

function moon(t){

  if(t>20)return;

  const x=W*.77;
  const y=H*.22;
  const r=Math.min(W,H)*.045;

  const g=c.createRadialGradient(
    x,y,0,
    x,y,r*5
  );

  g.addColorStop(
    0,
    "rgba(255,245,205,.25)"
  );

  g.addColorStop(
    1,
    "rgba(255,245,205,0)"
  );

  c.fillStyle=g;

  c.beginPath();
  c.arc(x,y,r*5,0,Math.PI*2);
  c.fill();

  c.fillStyle="#eee6c9";

  c.beginPath();
  c.arc(x,y,r,0,Math.PI*2);
  c.fill();
}


/* =====================================================
   SUN
===================================================== */

function sun(t){

  if(t<13||t>50)return;

  const p=clamp((t-13)/9,0,1);

  const x=W*.17;
  const y=H*.36;

  const g=c.createRadialGradient(
    x,y,0,
    x,y,W*.35
  );

  g.addColorStop(
    0,
    `rgba(255,206,112,${.25*p})`
  );

  g.addColorStop(
    1,
    "rgba(255,140,50,0)"
  );

  c.fillStyle=g;
  c.fillRect(0,0,W,H);

  c.fillStyle=`rgba(255,222,142,${.65*p})`;

  c.beginPath();
  c.arc(x,y,Math.min(W,H)*.035,0,Math.PI*2);
  c.fill();
}


/* =====================================================
   HORIZON
===================================================== */

function horizon(){

  const y=H*.59;

  c.fillStyle="#0a1012";

  c.beginPath();

  c.moveTo(0,H);
  c.lineTo(0,y);

  for(let x=0;x<=W;x+=30){

    const yy=
      y-
      Math.sin(x*.009)*7-
      Math.sin(x*.031)*4;

    c.lineTo(x,yy);
  }

  c.lineTo(W,H);
  c.closePath();

  c.fill();
}


/* =====================================================
   CANAL
===================================================== */

function canal(t){

  if(t<14)return;

  const y=H*.59;

  const top=W*.14;
  const bottom=W*.98;

  const grad=c.createLinearGradient(
    0,y,0,H
  );

  grad.addColorStop(0,"#42616a");
  grad.addColorStop(.45,"#1b3b45");
  grad.addColorStop(1,"#07151b");

  c.fillStyle=grad;

  c.beginPath();

  c.moveTo(W/2-top/2,y);
  c.lineTo(W/2+top/2,y);

  c.lineTo(W/2+bottom/2,H);
  c.lineTo(W/2-bottom/2,H);

  c.closePath();
  c.fill();

  /* water movement */

  for(let i=0;i<50;i++){

    const p=i/50;

    const yy=
      y+
      Math.pow(p,1.7)*(H-y);

    const width=
      lerp(top,bottom,p)*.42;

    const x=
      W/2+
      Math.sin(time*1.2+i)*12;

    c.strokeStyle=
      `rgba(220,205,165,${.025+p*.025})`;

    c.lineWidth=1;

    c.beginPath();

    c.moveTo(x-width,yy);
    c.lineTo(x+width,yy);

    c.stroke();
  }
}


/* =====================================================
   PLANE
===================================================== */

function plane(x,y,s,rotation=0){

  c.save();

  c.translate(x,y);
  c.rotate(rotation);
  c.scale(s,s);

  /* exhaust glow */

  const glow=c.createRadialGradient(
    -55,0,0,
    -55,0,65
  );

  glow.addColorStop(
    0,
    "rgba(255,180,80,.3)"
  );

  glow.addColorStop(
    1,
    "rgba(255,100,20,0)"
  );

  c.fillStyle=glow;

  c.beginPath();
  c.arc(-55,0,65,0,Math.PI*2);
  c.fill();

  /* body */

  const metal=c.createLinearGradient(
    0,-12,0,12
  );

  metal.addColorStop(0,"#cbd0cf");
  metal.addColorStop(.5,"#626d72");
  metal.addColorStop(1,"#182025");

  c.fillStyle=metal;

  c.beginPath();

  c.moveTo(-72,2);
  c.lineTo(-20,-7);
  c.lineTo(52,-4);
  c.lineTo(72,0);
  c.lineTo(52,4);
  c.lineTo(-20,7);
  c.closePath();

  c.fill();

  /* wings */

  c.fillStyle="#323d43";

  c.beginPath();

  c.moveTo(-3,0);
  c.lineTo(-42,-32);
  c.lineTo(-7,-16);
  c.lineTo(25,0);
  c.closePath();

  c.fill();

  c.beginPath();

  c.moveTo(-3,2);
  c.lineTo(-40,27);
  c.lineTo(-8,15);
  c.lineTo(25,2);
  c.closePath();

  c.fill();

  /* tail */

  c.fillStyle="#20292e";

  c.beginPath();

  c.moveTo(-48,0);
  c.lineTo(-62,-22);
  c.lineTo(-44,-10);
  c.closePath();

  c.fill();

  /* cockpit */

  c.fillStyle="#08151c";

  c.beginPath();

  c.ellipse(
    28,-3,
    13,5,
    0,
    0,
    Math.PI*2
  );

  c.fill();

  /* engine */

  c.fillStyle="#ffbf65";

  c.beginPath();
  c.arc(-69,2,3.5,0,Math.PI*2);
  c.fill();

  c.restore();
}


/* =====================================================
   AIR FORMATION
===================================================== */

function planes(t){

  if(t<4||t>31)return;

  const local=t-4;

  for(let i=0;i<4;i++){

    const speed=W/14;

    const x=
      -250+
      local*speed+
      i*250;

    const y=
      H*.22+
      i*H*.055+
      Math.sin(t*.8+i)*14;

    const s=.55+i*.07;

    plane(
      x,
      y,
      s,
      -.035
    );

    if(x>-100&&x<W+100){

      c.strokeStyle=
        "rgba(225,230,225,.14)";

      c.lineWidth=2;

      c.beginPath();

      c.moveTo(
        x-80*s,
        y+3
      );

      c.lineTo(
        x-240*s,
        y+15
      );

      c.stroke();
    }
  }
}


/* =====================================================
   TANK
===================================================== */

function tank(x,y,s){

  c.save();

  c.translate(x,y);
  c.scale(s,s);

  /* shadow */

  c.fillStyle="rgba(0,0,0,.45)";

  c.beginPath();
  c.ellipse(0,35,85,15,0,0,Math.PI*2);
  c.fill();

  /* tracks */

  c.fillStyle="#171b19";

  roundRect(-78,4,156,38,10);
  c.fill();

  /* wheels */

  for(let i=-58;i<=58;i+=29){

    c.fillStyle="#3a3d39";

    c.beginPath();
    c.arc(i,23,12,0,Math.PI*2);
    c.fill();

    c.fillStyle="#111412";

    c.beginPath();
    c.arc(i,23,5,0,Math.PI*2);
    c.fill();
  }

  /* hull */

  c.fillStyle="#4b5147";

  c.beginPath();

  c.moveTo(-62,-7);
  c.lineTo(-43,-31);
  c.lineTo(35,-31);
  c.lineTo(62,-7);
  c.lineTo(53,13);
  c.lineTo(-60,13);
  c.closePath();

  c.fill();

  /* turret */

  c.fillStyle="#363c35";

  c.beginPath();

  c.ellipse(
    5,-31,
    36,18,
    0,
    0,
    Math.PI*2
  );

  c.fill();

  /* barrel */

  c.fillStyle="#252a26";

  roundRect(
    20,-38,
    95,
    9,
    4
  );

  c.fill();

  c.restore();
}

function roundRect(x,y,w,h,r){

  c.beginPath();

  c.moveTo(x+r,y);
  c.lineTo(x+w-r,y);

  c.quadraticCurveTo(
    x+w,y,
    x+w,y+r
  );

  c.lineTo(x+w,y+h-r);

  c.quadraticCurveTo(
    x+w,y+h,
    x+w-r,y+h
  );

  c.lineTo(x+r,y+h);

  c.quadraticCurveTo(
    x,y+h,
    x,y+h-r
  );

  c.lineTo(x,y+r);

  c.quadraticCurveTo(
    x,y,
    x+r,y
  );

  c.closePath();
}


/* =====================================================
   TANK MOVEMENT
===================================================== */

function tanks(t){

  if(t<24||t>48)return;

  const p=clamp((t-24)/10,0,1);

  for(let i=0;i<7;i++){

    const depth=i/7;

    const x=
      -150+
      ((t*90)+(i*190))%(W+350);

    const y=
      H*.69+
      depth*H*.17;

    const scale=
      .28+
      depth*.5;

    tank(
      x,
      y,
      scale*(.7+p*.3)
    );
  }

  /* dust */

  for(let i=0;i<45;i++){

    const x=
      ((i*120+t*80)%(W+100))-50;

    const y=
      H*.72+
      Math.sin(i*2)*18;

    c.fillStyle=
      "rgba(195,160,105,.035)";

    c.beginPath();
    c.arc(x,y,rand(4,14),0,Math.PI*2);
    c.fill();
  }
}


/* =====================================================
   SMOKE
===================================================== */

function addSmoke(x,y,count=15){

  for(let i=0;i<count;i++){

    smoke.push({
      x:x+rand(-10,10),
      y:y+rand(-6,6),
      r:rand(4,12),
      vx:rand(-.45,.45),
      vy:rand(-1.2,-.35),
      life:1
    });
  }
}

function updateSmoke(){

  for(let i=smoke.length-1;i>=0;i--){

    const s=smoke[i];

    s.x+=s.vx;
    s.y+=s.vy;

    s.r+=.3;
    s.life-=.009;

    if(s.life<=0)
      smoke.splice(i,1);
  }
}

function drawSmoke(){

  for(const s of smoke){

    const g=c.createRadialGradient(
      s.x,s.y,0,
      s.x,s.y,s.r
    );

    g.addColorStop(
      0,
      `rgba(60,60,55,${s.life*.15})`
    );

    g.addColorStop(
      1,
      "rgba(30,30,28,0)"
    );

    c.fillStyle=g;

    c.beginPath();
    c.arc(s.x,s.y,s.r,0,Math.PI*2);
    c.fill();
  }
}


/* =====================================================
   LIGHT TRAILS
===================================================== */

function launch(){

  rockets.push({
    x:rand(W*.15,W*.85),
    y:H*.76,
    tx:rand(W*.25,W*.75),
    ty:rand(H*.25,H*.48),
    p:0
  });
}

function updateRockets(){

  for(let i=rockets.length-1;i>=0;i--){

    const r=rockets[i];

    r.p+=.028;

    if(r.p>=1){

      addSmoke(r.tx,r.ty,22);

      flash();

      impact();

      rockets.splice(i,1);
    }
  }
}

function drawRockets(){

  for(const r of rockets){

    const p=ease(r.p);

    const x=lerp(r.x,r.tx,p);
    const y=lerp(r.y,r.ty,p);

    const pp=ease(clamp(r.p-.12,0,1));

    const px=lerp(r.x,r.tx,pp);
    const py=lerp(r.y,r.ty,pp);

    c.strokeStyle="rgba(255,196,92,.6)";
    c.lineWidth=3;

    c.beginPath();
    c.moveTo(px,py);
    c.lineTo(x,y);
    c.stroke();

    c.fillStyle="#ffd77e";

    c.beginPath();
    c.arc(x,y,4,0,Math.PI*2);
    c.fill();
  }
}


/* =====================================================
   FLASH
===================================================== */

function flash(){

  const el=document.getElementById("flash");

  el.style.transition="none";
  el.style.opacity=".72";

  setTimeout(()=>{
    el.style.transition="opacity .7s";
    el.style.opacity="0";
  },30);
}


/* =====================================================
   FLAG
===================================================== */

function flag(t){

  if(t<42)return;

  const p=ease(clamp((t-42)/7,0,1));

  const w=Math.min(W*.48,560);
  const h=w*.63;

  const x=W/2-w/2;
  const y=H*.22;

  c.save();

  c.globalAlpha=p;

  c.shadowBlur=70;
  c.shadowColor="rgba(255,210,120,.25)";

  c.fillStyle="#c72c31";
  c.fillRect(x,y,w,h/3);

  c.fillStyle="#eee";
  c.fillRect(x,y+h/3,w,h/3);

  c.fillStyle="#171919";
  c.fillRect(x,y+h*2/3,w,h/3);

  /* golden symbolic eagle */

  c.fillStyle="#c99b38";

  c.beginPath();

  c.moveTo(x+w*.50,y+h*.39);

  c.lineTo(x+w*.43,y+h*.32);
  c.lineTo(x+w*.36,y+h*.43);

  c.lineTo(x+w*.44,y+h*.48);

  c.lineTo(x+w*.50,y+h*.57);

  c.lineTo(x+w*.56,y+h*.48);

  c.lineTo(x+w*.64,y+h*.43);

  c.lineTo(x+w*.57,y+h*.32);

  c.closePath();

  c.fill();

  c.restore();
}


/* =====================================================
   CINEMATIC LIGHT
===================================================== */

function cinematicLight(t){

  if(t<10||t>45)return;

  const p=
    Math.sin(t*.35)*.5+.5;

  const g=c.createLinearGradient(
    0,0,W,H
  );

  g.addColorStop(
    0,
    `rgba(255,190,100,${.025*p})`
  );

  g.addColorStop(
    .5,
    "rgba(0,0,0,0)"
  );

  g.addColorStop(
    1,
    `rgba(20,30,50,${.06*(1-p)})`
  );

  c.fillStyle=g;
  c.fillRect(0,0,W,H);
}


/* =====================================================
   EVENTS
===================================================== */

let lastLaunch=0;

function events(t){

  if(t>29&&t<42){

    if(t-lastLaunch>2.4){

      launch();
      lastLaunch=t;
    }
  }

  if(t>18&&t<30){

    if(Math.random()<.008){

      addSmoke(
        W/2+rand(-W*.3,W*.3),
        H*.61,
        10
      );
    }
  }
}


/* =====================================================
   CAMERA
===================================================== */

function camera(t){

  let zoom=1;

  if(t>17&&t<28){

    zoom=
      1+
      Math.sin((t-17)*.3)*.018;
  }

  if(t>29&&t<42){

    zoom=
      1+
      Math.sin(t*1.7)*.025;
  }

  const shake=
    t>29&&t<42
      ? Math.sin(t*19)*1.7
      : 0;

  canvas.style.transform=
    `translate(${shake}px,${shake*.4}px) scale(${zoom})`;

  fx.style.transform=
    `translate(${shake*.5}px,${shake*.2}px) scale(${zoom})`;
}


/* =====================================================
   FRAME
===================================================== */

function draw(t){

  c.clearRect(0,0,W,H);

  sky(t);
  stars(t);
  moon(t);
  sun(t);

  horizon();
  canal(t);

  planes(t);
  tanks(t);

  updateSmoke();
  drawSmoke();

  updateRockets();
  drawRockets();

  flag(t);

  cinematicLight(t);
  events(t);

  camera(t);
  updateTitle(t);

  document
    .querySelector("#progress span")
    .style.width=
      clamp(t/LENGTH,0,1)*100+"%";

  const sec=Math.floor(t);

  document.getElementById("counter").textContent=
    String(Math.floor(sec/60)).padStart(2,"0")
    +":"+
    String(sec%60).padStart(2,"0");
}


/* =====================================================
   MAIN LOOP
===================================================== */

function loop(){

  if(running){

    time=
      (performance.now()-startTime)/1000;

    if(time>=LENGTH){

      time=LENGTH;
      running=false;

      document
        .getElementById("ending")
        .classList.add("show");
    }

    draw(time);
  }

  requestAnimationFrame(loop);
}

requestAnimationFrame(loop);


/* =====================================================
   START
===================================================== */

document
  .getElementById("start")
  .onclick=()=>{

    initAudio();

    if(audio&&audio.state==="suspended")
      audio.resume();

    running=true;
    time=0;
    startTime=performance.now();

    document
      .getElementById("intro")
      .style.opacity="0";

    document
      .getElementById("controls")
      .style.opacity="1";

    sound(150,.8,.05);
  };


/* =====================================================
   REPLAY
===================================================== */

document
  .getElementById("again")
  .onclick=()=>{

    document
      .getElementById("ending")
      .classList.remove("show");

    smoke=[];
    rockets=[];

    sceneIndex=-1;

    time=0;
    startTime=performance.now();
    running=true;

    flash();
  };


/* =====================================================
   SOUND
===================================================== */

document
  .getElementById("sound")
  .onclick=()=>{

    muted=!muted;

    document.getElementById("sound")
      .textContent=
        muted?"🔇":"🔊";
  };


/* =====================================================
   INITIAL
===================================================== */

draw(0);

</script>
