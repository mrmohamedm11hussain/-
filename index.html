<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>٦ أكتوبر — فيلم العبور</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#020304;
  font-family:"Tahoma","Arial",sans-serif;
}

body{
  color:#fff;
}

#app{
  position:fixed;
  inset:0;
  overflow:hidden;
  background:#020304;
}

canvas{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
}

#grain{
  position:absolute;
  inset:-30%;
  pointer-events:none;
  opacity:.07;
  mix-blend-mode:screen;
  background-image:
    radial-gradient(
      rgba(255,255,255,.8) .6px,
      transparent .8px
    );
  background-size:4px 4px;
  animation:noise .13s steps(2) infinite;
}

@keyframes noise{
  0%{transform:translate(0,0)}
  25%{transform:translate(2%,-1%)}
  50%{transform:translate(-1%,2%)}
  75%{transform:translate(1%,1%)}
  100%{transform:translate(-2%,-1%)}
}

#vignette{
  position:absolute;
  inset:0;
  pointer-events:none;
  background:
    radial-gradient(
      ellipse at center,
      transparent 38%,
      rgba(0,0,0,.2) 65%,
      rgba(0,0,0,.9) 125%
    );
}

#intro{
  position:absolute;
  inset:0;
  z-index:20;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  background:
    radial-gradient(
      circle at center,
      #101820 0,
      #030506 55%,
      #000 100%
    );
  transition:opacity 1.6s ease;
}

.intro-date{
  font-size:clamp(55px,13vw,150px);
  font-weight:900;
  letter-spacing:7px;
  line-height:1;
  text-shadow:
    0 0 30px rgba(255,255,255,.08),
    0 20px 70px #000;
}

.intro-title{
  margin-top:22px;
  font-size:clamp(19px,4vw,34px);
  letter-spacing:5px;
  color:#d6bd7c;
}

.intro-line{
  width:100px;
  height:1px;
  margin:35px 0;
  background:#c4a762;
}

#start{
  border:1px solid rgba(255,255,255,.4);
  background:rgba(255,255,255,.035);
  color:#fff;
  border-radius:50px;
  padding:15px 42px;
  font-size:15px;
  cursor:pointer;
  backdrop-filter:blur(12px);
  transition:.35s;
}

#start:hover{
  background:rgba(255,255,255,.12);
  transform:translateY(-3px);
}

#hint{
  margin-top:16px;
  font-size:10px;
  color:rgba(255,255,255,.38);
}

#caption{
  position:absolute;
  z-index:8;
  left:50%;
  bottom:9%;
  transform:translateX(-50%);
  width:min(900px,90%);
  text-align:center;
  pointer-events:none;
  opacity:0;
  transition:opacity .7s;
  text-shadow:0 4px 30px #000;
}

#caption .date{
  font-size:11px;
  letter-spacing:4px;
  color:#d5bd7b;
  margin-bottom:10px;
}

#caption .title{
  font-size:clamp(24px,5vw,58px);
  font-weight:900;
}

#caption .text{
  max-width:760px;
  margin:13px auto 0;
  font-size:clamp(12px,2vw,17px);
  line-height:1.9;
  color:rgba(255,255,255,.84);
}

#timeline{
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  height:3px;
  z-index:12;
  background:rgba(255,255,255,.08);
}

#timelineBar{
  width:0;
  height:100%;
  background:linear-gradient(
    90deg,
    #9b7c36,
    #f2df9b,
    #9b7c36
  );
  box-shadow:0 0 15px rgba(220,190,100,.7);
}

#topInfo{
  position:absolute;
  z-index:8;
  top:20px;
  left:22px;
  right:22px;
  display:flex;
  justify-content:space-between;
  font-size:10px;
  letter-spacing:3px;
  color:rgba(255,255,255,.48);
  pointer-events:none;
}

#end{
  position:absolute;
  inset:0;
  z-index:30;
  background:#000;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  text-align:center;
  opacity:0;
  pointer-events:none;
  transition:opacity 2.5s ease;
}

.end-title{
  font-size:clamp(50px,11vw,140px);
  font-weight:900;
}

.end-date{
  margin-top:20px;
  color:#d3ba73;
  font-size:clamp(15px,3vw,27px);
  letter-spacing:5px;
}

.end-line{
  width:120px;
  height:1px;
  background:#b08e48;
  margin:35px 0;
}

.end-small{
  color:rgba(255,255,255,.48);
  font-size:12px;
  letter-spacing:2px;
}

#soundBadge{
  position:absolute;
  z-index:15;
  top:52px;
  left:22px;
  opacity:0;
  transition:.5s;
  font-size:10px;
  color:rgba(255,255,255,.45);
}

@media(max-width:600px){
  #topInfo{
    top:12px;
    left:12px;
    right:12px;
  }

  #soundBadge{
    top:42px;
    left:12px;
  }
}
</style>
</head>

<body>

<div id="app">

<canvas id="canvas"></canvas>

<div id="grain"></div>
<div id="vignette"></div>

<div id="topInfo">
  <span>٦ أكتوبر ١٩٧٣</span>
  <span>فيلم العبور</span>
</div>

<div id="soundBadge">● الصوت يعمل</div>

<div id="caption">
  <div class="date"></div>
  <div class="title"></div>
  <div class="text"></div>
</div>

<div id="timeline">
  <div id="timelineBar"></div>
</div>

<div id="intro">
  <div class="intro-date">06.10.1973</div>
  <div class="intro-title">فيلم العبور</div>
  <div class="intro-line"></div>
  <button id="start">ابدأ الفيلم</button>
  <div id="hint">يفضل استخدام الصوت — التجربة مصممة للشاشة الكاملة</div>
</div>

<div id="end">
  <div class="end-title">نصر أكتوبر</div>
  <div class="end-line"></div>
  <div class="end-date">السادس من أكتوبر ١٩٧٣</div>
  <div class="end-line"></div>
  <div class="end-small">ذكرى العبور والنصر</div>
</div>

</div>

<script>
"use strict";

/* =========================================================
   ٦ أكتوبر — فيلم العبور
   تجربة تاريخية تفاعلية
========================================================= */

const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");

let W=innerWidth;
let H=innerHeight;
let DPR=Math.min(devicePixelRatio||1,1.5);

function resize(){

  W=innerWidth;
  H=innerHeight;

  DPR=Math.min(devicePixelRatio||1,1.5);

  canvas.width=W*DPR;
  canvas.height=H*DPR;

  ctx.setTransform(DPR,0,0,DPR,0,0);
}

addEventListener("resize",resize);
resize();

/* =========================================================
   AUDIO
========================================================= */

let audio=null;

function initAudio(){

  if(audio)return;

  const AC=
    window.AudioContext||
    window.webkitAudioContext;

  if(!AC)return;

  const ac=new AC();

  const master=ac.createGain();

  master.gain.value=.22;

  master.connect(ac.destination);

  audio={
    ac,
    master
  };

  /*
    cinematic low ambience
  */

  const drone=ac.createOscillator();
  const dg=ac.createGain();

  drone.type="sine";
  drone.frequency.value=39;

  dg.gain.value=.018;

  drone.connect(dg);
  dg.connect(master);

  drone.start();

  audio.drone=dg;
}

function tone(
  frequency,
  duration,
  volume=.07,
  type="sine"
){

  if(!audio)return;

  const ac=audio.ac;

  const osc=ac.createOscillator();
  const gain=ac.createGain();

  osc.type=type;

  osc.frequency.setValueAtTime(
    frequency,
    ac.currentTime
  );

  gain.gain.setValueAtTime(
    .0001,
    ac.currentTime
  );

  gain.gain.exponentialRampToValueAtTime(
    volume,
    ac.currentTime+.04
  );

  gain.gain.exponentialRampToValueAtTime(
    .0001,
    ac.currentTime+duration
  );

  osc.connect(gain);
  gain.connect(audio.master);

  osc.start();

  osc.stop(
    ac.currentTime+
    duration+
    .05
  );
}

function whoosh(){

  if(!audio)return;

  const ac=audio.ac;

  const osc=ac.createOscillator();
  const gain=ac.createGain();

  osc.type="sawtooth";

  osc.frequency.setValueAtTime(
    90,
    ac.currentTime
  );

  osc.frequency.exponentialRampToValueAtTime(
    650,
    ac.currentTime+.9
  );

  osc.frequency.exponentialRampToValueAtTime(
    70,
    ac.currentTime+1.7
  );

  gain.gain.setValueAtTime(
    .0001,
    ac.currentTime
  );

  gain.gain.exponentialRampToValueAtTime(
    .09,
    ac.currentTime+.65
  );

  gain.gain.exponentialRampToValueAtTime(
    .0001,
    ac.currentTime+1.8
  );

  osc.connect(gain);
  gain.connect(audio.master);

  osc.start();

  osc.stop(ac.currentTime+1.9);
}

function boom(){

  if(!audio)return;

  tone(45,.8,.14,"sawtooth");
  setTimeout(
    ()=>tone(75,.5,.08,"triangle"),
    90
  );
}

function water(){

  if(!audio)return;

  tone(115,1.2,.025,"sine");
  tone(160,.8,.018,"sine");
}

function radio(){

  if(!audio)return;

  tone(430,.18,.018,"square");

  setTimeout(
    ()=>tone(510,.13,.014,"square"),
    100
  );
}

/* =========================================================
   HELPERS
========================================================= */

function clamp(v,a,b){
  return Math.max(a,Math.min(b,v));
}

function lerp(a,b,t){
  return a+(b-a)*t;
}

function ease(t){
  return t*t*(3-2*t);
}

function smooth(a,b,t){
  return ease(
    clamp((t-a)/(b-a),0,1)
  );
}

function fade(t,a,b){
  return smooth(a,b,t);
}

/* =========================================================
   PARTICLES
========================================================= */

const stars=[];

for(let i=0;i<190;i++){

  stars.push({
    x:Math.random(),
    y:Math.random()*.7,
    r:.4+Math.random()*1.4,
    a:.2+Math.random()*.7,
    p:Math.random()*6
  });

}

const dust=[];

for(let i=0;i<180;i++){

  dust.push({
    x:Math.random(),
    y:Math.random(),
    r:3+Math.random()*25,
    speed:.2+Math.random()*1.2,
    p:Math.random()*6
  });

}

const smoke=[];

for(let i=0;i<60;i++){

  smoke.push({
    x:Math.random(),
    y:Math.random(),
    r:10+Math.random()*60,
    p:Math.random()*6
  });

}

/* =========================================================
   SKY
========================================================= */

function sky(top,bottom){

  const g=ctx.createLinearGradient(
    0,0,0,H
  );

  g.addColorStop(0,top);
  g.addColorStop(1,bottom);

  ctx.fillStyle=g;
  ctx.fillRect(0,0,W,H);
}

function stars(t){

  for(const s of stars){

    const a=
      s.a+
      Math.sin(t*.003+s.p)*.2;

    ctx.fillStyle=
      `rgba(255,255,255,${a})`;

    ctx.beginPath();

    ctx.arc(
      s.x*W,
      s.y*H,
      s.r,
      0,
      Math.PI*2
    );

    ctx.fill();
  }
}

function sun(x,y,r,a){

  const g=ctx.createRadialGradient(
    x,y,0,
    x,y,r
  );

  g.addColorStop(
    0,
    `rgba(255,239,183,${a})`
  );

  g.addColorStop(
    .25,
    `rgba(255,187,83,${a*.4})`
  );

  g.addColorStop(
    1,
    "rgba(255,140,40,0)"
  );

  ctx.fillStyle=g;

  ctx.beginPath();
  ctx.arc(x,y,r,0,Math.PI*2);
  ctx.fill();
}

/* =========================================================
   CINEMATIC MAP
========================================================= */

function drawMap(t,phase){

  ctx.fillStyle="#10191b";
  ctx.fillRect(0,0,W,H);

  /*
    Egypt
  */

  ctx.fillStyle="#75684c";

  ctx.beginPath();

  ctx.moveTo(W*.05,H*.15);
  ctx.lineTo(W*.46,H*.13);
  ctx.lineTo(W*.51,H*.34);
  ctx.lineTo(W*.46,H*.56);
  ctx.lineTo(W*.25,H*.67);
  ctx.lineTo(W*.08,H*.55);
  ctx.closePath();

  ctx.fill();

  /*
    Sinai
  */

  ctx.fillStyle="#907d55";

  ctx.beginPath();

  ctx.moveTo(W*.51,H*.34);
  ctx.lineTo(W*.91,H*.17);
  ctx.lineTo(W*.97,H*.55);
  ctx.lineTo(W*.52,H*.65);
  ctx.closePath();

  ctx.fill();

  /*
    Nile
  */

  ctx.strokeStyle="#446b72";
  ctx.lineWidth=14;

  ctx.beginPath();

  ctx.moveTo(W*.18,H*.15);
  ctx.bezierCurveTo(
    W*.29,H*.28,
    W*.36,H*.37,
    W*.47,H*.48
  );

  ctx.stroke();

  /*
    Suez Canal
  */

  ctx.strokeStyle="#4e777d";
  ctx.lineWidth=8;

  ctx.beginPath();

  ctx.moveTo(W*.51,H*.34);
  ctx.lineTo(W*.51,H*.64);

  ctx.stroke();

  /*
    labels
  */

  ctx.fillStyle="rgba(255,255,255,.75)";
  ctx.font="bold 15px Tahoma";

  ctx.fillText(
    "مصر",
    W*.25,
    H*.30
  );

  ctx.fillText(
    "سيناء",
    W*.72,
    H*.30
  );

  ctx.fillStyle="#e1c47a";

  ctx.font="bold 13px Tahoma";

  ctx.fillText(
    "قناة السويس",
    W*.53,
    H*.51
  );

  /*
    attack arrows
  */

  const p=smooth(0,.8,phase);

  ctx.strokeStyle=
    `rgba(190,52,44,${p})`;

  ctx.lineWidth=4;

  for(let i=0;i<5;i++){

    const yy=
      H*.36+
      i*H*.045;

    ctx.beginPath();

    ctx.moveTo(
      W*.52,
      yy
    );

    ctx.lineTo(
      W*.75,
      yy+H*.025
    );

    ctx.stroke();

    ctx.beginPath();

    ctx.moveTo(
      W*.75,
      yy+H*.025
    );

    ctx.lineTo(
      W*.72,
      yy+H*.005
    );

    ctx.moveTo(
      W*.75,
      yy+H*.025
    );

    ctx.lineTo(
      W*.72,
      yy+H*.045
    );

    ctx.stroke();
  }
}

/* =========================================================
   CANAL
========================================================= */

function canal(t){

  const horizon=H*.43;

  /*
    sky
  */

  sky(
    "#a96847",
    "#e3b778"
  );

  sun(
    W*.72,
    H*.26,
    H*.35,
    .75
  );

  /*
    distant desert
  */

  ctx.fillStyle="#786b4d";

  ctx.fillRect(
    0,
    horizon,
    W,
    H-horizon
  );

  /*
    canal perspective
  */

  ctx.beginPath();

  ctx.moveTo(
    W*.47,
    horizon
  );

  ctx.lineTo(
    W*.53,
    horizon
  );

  ctx.lineTo(
    W*.94,
    H
  );

  ctx.lineTo(
    W*.06,
    H
  );

  ctx.closePath();

  const waterG=
    ctx.createLinearGradient(
      0,horizon,
      0,H
    );

  waterG.addColorStop(
    0,
    "#375b61"
  );

  waterG.addColorStop(
    .45,
    "#23464f"
  );

  waterG.addColorStop(
    1,
    "#08191f"
  );

  ctx.fillStyle=waterG;
  ctx.fill();

  /*
    reflections
  */

  for(let i=0;i<95;i++){

    const p=i/95;

    const y=
      horizon+
      Math.pow(p,1.65)*
      (H-horizon);

    const width=
      lerp(8,220,p);

    const drift=
      Math.sin(t*.003+i)*15;

    ctx.strokeStyle=
      i%3===0
      ? "rgba(220,203,151,.18)"
      : "rgba(130,170,166,.13)";

    ctx.lineWidth=1;

    ctx.beginPath();

    ctx.moveTo(
      W/2-width+drift,
      y
    );

    ctx.lineTo(
      W/2+width+drift,
      y
    );

    ctx.stroke();
  }

  /*
    shores
  */

  ctx.strokeStyle=
    "rgba(225,196,133,.5)";

  ctx.lineWidth=2;

  ctx.beginPath();

  ctx.moveTo(
    W*.47,
    horizon
  );

  ctx.lineTo(
    W*.06,
    H
  );

  ctx.moveTo(
    W*.53,
    horizon
  );

  ctx.lineTo(
    W*.94,
    H
  );

  ctx.stroke();
}

/* =========================================================
   BOAT SILHOUETTES
========================================================= */

function boat(x,y,s,dir=1){

  ctx.save();

  ctx.translate(x,y);
  ctx.scale(s*dir,s);

  ctx.fillStyle="#101617";

  ctx.beginPath();

  ctx.moveTo(-55,0);
  ctx.lineTo(42,0);
  ctx.lineTo(56,-10);
  ctx.lineTo(33,11);
  ctx.lineTo(-43,11);
  ctx.closePath();

  ctx.fill();

  ctx.fillRect(
    -18,-22,
    38,22
  );

  ctx.fillRect(
    -7,-36,
    14,15
  );

  ctx.strokeStyle="#111";
  ctx.lineWidth=3;

  ctx.beginPath();

  ctx.moveTo(0,-35);
  ctx.lineTo(0,-65);

  ctx.stroke();

  ctx.restore();
}

/* =========================================================
   BRIDGE
========================================================= */

function bridge(){

  const y=H*.44;

  ctx.strokeStyle="rgba(25,29,27,.85)";
  ctx.lineWidth=5;

  ctx.beginPath();

  ctx.moveTo(0,y);
  ctx.lineTo(W,y);

  ctx.stroke();

  for(let x=0;x<W;x+=W*.12){

    ctx.beginPath();

    ctx.moveTo(x,y);
    ctx.lineTo(x,H*.62);

    ctx.stroke();
  }
}

/* =========================================================
   DESERT
========================================================= */

function desert(t){

  sky(
    "#6e4a3c",
    "#1d211e"
  );

  sun(
    W*.55,
    H*.3,
    H*.3,
    .28
  );

  ctx.fillStyle="#66543c";

  ctx.beginPath();

  ctx.moveTo(0,H*.56);

  for(
    let x=0;
    x<=W;
    x+=50
  ){

    ctx.lineTo(
      x,
      H*.56+
      Math.sin(x*.009+t*.001)*18
    );
  }

  ctx.lineTo(W,H);
  ctx.lineTo(0,H);
  ctx.closePath();

  ctx.fill();
}

/* =========================================================
   FORTIFICATION
========================================================= */

function fortification(){

  const y=H*.55;

  ctx.fillStyle="#594936";

  ctx.fillRect(
    0,y,
    W,
    H*.2
  );

  /*
    sand berm
  */

  ctx.beginPath();

  ctx.moveTo(0,y);

  for(let x=0;x<=W;x+=35){

    ctx.lineTo(
      x,
      y-
      25-
      Math.sin(x*.03)*10
    );
  }

  ctx.lineTo(W,y+70);
  ctx.lineTo(0,y+70);

  ctx.closePath();

  ctx.fill();

  /*
    distant posts
  */

  ctx.strokeStyle="#27271f";
  ctx.lineWidth=4;

  for(
    let x=50;
    x<W;
    x+=100
  ){

    ctx.beginPath();

    ctx.moveTo(x,y-55);
    ctx.lineTo(x,y-5);

    ctx.stroke();
  }
}

/* =========================================================
   SMOKE
========================================================= */

function smokeClouds(t,intensity){

  for(let i=0;i<45;i++){

    const p=i/45;

    const x=
      W*.45+
      Math.sin(i*2.3+t*.001)*90+
      p*130;

    const y=
      H*.58-
      p*H*.35+
      Math.sin(t*.001+i)*12;

    const r=
      10+
      p*75;

    const g=ctx.createRadialGradient(
      x,y,0,
      x,y,r
    );

    g.addColorStop(
      0,
      `rgba(54,56,51,${.15*intensity*(1-p)})`
    );

    g.addColorStop(
      1,
      "rgba(20,20,18,0)"
    );

    ctx.fillStyle=g;

    ctx.beginPath();
    ctx.arc(x,y,r,0,Math.PI*2);
    ctx.fill();
  }
}

/* =========================================================
   DUST
========================================================= */

function dustStorm(t,intensity){

  for(let i=0;i<150;i++){

    const d=dust[i];

    const x=
      ((d.x*W+t*d.speed*45)%
      (W+200))-100;

    const y=
      H*.61+
      Math.sin(
        t*.002+d.p
      )*H*.16+
      d.y*H*.15;

    ctx.fillStyle=
      `rgba(193,163,111,${.025*intensity})`;

    ctx.beginPath();

    ctx.arc(
      x,
      y,
      d.r*intensity,
      0,
      Math.PI*2
    );

    ctx.fill();
  }
}

/* =========================================================
   LIGHT
========================================================= */

function flash(a){

  ctx.fillStyle=
    `rgba(255,216,153,${a})`;

  ctx.fillRect(
    0,0,W,H
  );
}

/* =========================================================
   TIMELINE
========================================================= */

const scenes=[

  {
    a:0,
    b:8,
    date:"",
    title:"",
    text:""
  },

  {
    a:8,
    b:22,
    date:"قبل العبور",
    title:"ست سنوات من الانتظار",
    text:

  },

    title:"بداية المعركة",
    text:

  },

  {
    a:34,
    b:50,
    date:"الساعة الأولى",
    title:"العبور",

      "عبرت القوات المصرية قناة السويس في قطاعات عديدة، وبدأت في إنشاء رؤوس جسور على الضفة الشرقية."
  },

  {
    a:50,
    b:65,
    date:"الجبهة الشرقية",

    text:
      "تقدمت القوات المصرية نحو التحصينات الإسرائيلية على الضفة الشرقية للقناة، وبدأ اختراق مواقعها."
  },

  {

    title:"تثبيت رؤوس الكباري",
    text:
      "تواصل تدفق القوات عبر القناة، واستمرت المعارك والهجمات المضادة على الجبهة."

    text:

  },

  {
    a:108,
    b:116,
    date:"",
    title:"",
    text:""
  }

];

const TOTAL=116;

let running=false;
let startedAt=0;
let triggered={};

function getScene(t){

  for(
    let i=0;
    i<scenes.length;
    i++
  ){

    if(
      t>=scenes[i].a &&
      t<scenes[i].b
    ){
      return i;
    }
  }

  return scenes.length-1;
}

/* =========================================================
   SOUND EVENTS
========================================================= */

function sceneSound(index){

  if(triggered[index])return;

  triggered[index]=true;

  if(index===1){

    tone(
      55,
      2.5,
      .035,
      "sine"
    );

  }

  if(index===2){

    whoosh();

    setTimeout(
      ()=>boom(),
      900
    );

  }

  if(index===3){

    water();

    setTimeout(
      ()=>tone(
        95,
        1,
        .045,
        "triangle"
      ),
      700
    );

  }

  if(index===4){

    whoosh();

    setTimeout(
      ()=>boom(),
      600
    );

  }

  if(index===5){

    boom();

    setTimeout(
      ()=>water(),
      1000
    );

  }

  if(index===6){

    tone(
      48,
      3,
      .04,
      "sine"
    );

  }

  if(index===7){

    tone(
      70,
      4,
      .035,
      "triangle"
    );
  }
}

/* =========================================================
   SCENE 0 — INTRO
========================================================= */

function sceneIntro(t,p){

  ctx.fillStyle="#020304";
  ctx.fillRect(0,0,W,H);

  /*
    faint film light
  */

  const a=
    .04+
    Math.sin(t*.4)*.015;

  ctx.fillStyle=
    `rgba(255,220,160,${a})`;

  ctx.fillRect(
    0,
    0,
    W,
    H
  );
}

/* =========================================================
   SCENE 1 — BEFORE WAR
========================================================= */

function sceneBefore(t,p){

  sky(
    "#061018",
    "#182329"
  );

  stars(t);

  /*
    map gradually emerges
  */

  ctx.globalAlpha=
    smooth(0,.35,p);

  drawMap(
    t,
    p
  );

  ctx.globalAlpha=1;

  /*
    date marker
  */

  ctx.strokeStyle=
    "rgba(210,180,100,.45)";

  ctx.lineWidth=1;

  ctx.beginPath();

  ctx.moveTo(
    W*.18,
    H*.76
  );

  ctx.lineTo(
    W*.82,
    H*.76
  );

  ctx.stroke();

  /*
    moving light = passage of time
  */

  const x=
    lerp(
      W*.18,
      W*.82,
      p
    );

  ctx.fillStyle="#e3ca83";

  ctx.beginPath();

  ctx.arc(
    x,
    H*.76,
    4,
    0,
    Math.PI*2
  );

  ctx.fill();
}

/* =========================================================
   SCENE 2 — BEGINNING
========================================================= */

function sceneBeginning(t,p){

  sky(
    "#b76b4b",
    "#24231e"
  );

  sun(
    W*.69,
    H*.29,
    H*.33,
    .65
  );

  /*
    aerial abstract formation
  */

  for(let i=0;i<8;i++){

    const x=
      W*.15+
      i*W*.1+
      Math.sin(t*.004+i)*20;

    const y=
      H*.27+
      Math.sin(t*.003+i)*20;

    /*
      distant aircraft represented
      as small cinematic silhouettes
    */

    ctx.fillStyle=
      "rgba(20,25,24,.8)";

    ctx.beginPath();

    ctx.ellipse(
      x,
      y,
      18,
      4,
      -.05,
      0,
      Math.PI*2
    );

    ctx.fill();

    ctx.strokeStyle=
      "rgba(20,25,24,.55)";

    ctx.lineWidth=2;

    ctx.beginPath();

    ctx.moveTo(
      x-3,
      y
    );

    ctx.lineTo(
      x-22,
      y-10
    );

    ctx.moveTo(
      x-3,
      y
    );

    ctx.lineTo(
      x-22,
      y+10
    );

    ctx.stroke();
  }

  /*
    horizon
  */

  ctx.fillStyle="#24251f";

  ctx.fillRect(
    0,
    H*.57,
    W,
    H*.43
  );

  /*
    distant flashes
  */

  for(let i=0;i<4;i++){

    const x=
      W*.15+
      ((t*70+i*190)%(
        W*.75
      ));

    const y=
      H*.5+
      Math.sin(i+t*.004)*25;

    const a=
      Math.max(
        0,
        Math.sin(
          t*.02+i
        )
      )*.25;

    flash(a);
  }
}

/* =========================================================
   SCENE 3 — CROSSING
========================================================= */

function sceneCrossing(t,p){

  canal(t);

  bridge();

  /*
    boats
  */

  boat(
    W*.44+
    Math.sin(t*.002)*15,
    H*.56,
    .65,
    1
  );

  boat(
    W*.56-
    Math.sin(t*.0017)*20,
    H*.63,
    .95,
    -1
  );

  boat(
    W*.48+
    Math.sin(t*.001)*30,
    H*.73,
    1.35,
    1
  );

  /*
    far silhouettes
  */

  for(let i=0;i<12;i++){

    const q=i/11;

    const x=
      W*.43+
      q*W*.14;

    const y=
      H*.48+
      q*H*.035;

    ctx.fillStyle=
      "rgba(12,17,16,.75)";

    ctx.beginPath();

    ctx.arc(
      x,
      y,
      3+q*3,
      0,
      Math.PI*2
    );

    ctx.fill();

    ctx.fillRect(
      x-2,
      y,
      4,
      10+q*7
    );
  }

  /*
    camera push
  */

  const z=
    1+
    smooth(.1,1,p)*.055;

  ctx.save();

  ctx.globalAlpha=
    smooth(.2,.75,p)*.2;

  ctx.strokeStyle="#e2c67f";
  ctx.lineWidth=2;

  ctx.beginPath();

  ctx.moveTo(
    W*.5,
    H*.48
  );

  ctx.lineTo(
    W*.5,
    H*.8
  );

  ctx.stroke();

  ctx.restore();

  if(p>.65){

    flash(
      (1-p)*.12
    );
  }
}

/* =========================================================
   SCENE 4 — BAR LEV
========================================================= */

function sceneBarLev(t,p){

  desert(t);

  fortification();

  /*
    distant fortified positions
  */

  for(let i=0;i<6;i++){

    const x=
      W*.12+
      i*W*.15;

    const y=
      H*.48+
      Math.sin(i)*5;

    ctx.fillStyle="#38382d";

    ctx.fillRect(
      x,
      y,
      55,
      30
    );

    ctx.fillStyle="#25261f";

    ctx.fillRect(
      x+10,
      y-16,
      35,
      18
    );
  }

  /*
    advancing silhouettes
  */

  for(let i=0;i<8;i++){

    const q=i/7;

    const x=
      W*.1+
      q*W*.8;

    const y=
      H*.73+
      q*H*.1;

    const s=
      .18+
      q*.5;

    /*
      vehicles represented
      as distant silhouettes
    */

    ctx.fillStyle=
      "rgba(22,25,22,.9)";

    ctx.beginPath();

    ctx.ellipse(
      x,
      y,
      45*s,
      14*s,
      0,
      0,
      Math.PI*2
    );

    ctx.fill();

    ctx.fillRect(
      x-25*s,
      y-13*s,
      50*s,
      13*s
    );
  }

  smokeClouds(
    t,
    1
  );

  dustStorm(
    t,
    1.2
  );

  /*
    cinematic light
  */

  const f=
    Math.max(
      0,
      Math.sin(
        t*.012
      )
    )*.12;

  flash(f);
}

/* =========================================================
   SCENE 5 — BRIDGEHEADS
========================================================= */

function sceneBridgehead(t,p){

  desert(t);

  /*
    canal at horizon
  */

  ctx.fillStyle="#36555a";

  ctx.fillRect(
    0,
    H*.43,
    W,
    25
  );

  /*
    bridges
  */

  for(let i=0;i<3;i++){

    const y=
      H*.46+
      i*H*.1;

    ctx.strokeStyle=
      "rgba(90,90,78,.8)";

    ctx.lineWidth=8;

    ctx.beginPath();

    ctx.moveTo(
      W*.15,
      y
    );

    ctx.lineTo(
      W*.85,
      y
    );

    ctx.stroke();
  }

  /*
    flow of silhouettes
  */

  for(let i=0;i<14;i++){

    const q=i/13;

    const x=
      W*.08+
      q*W*.84;

    const y=
      H*.57+
      q*H*.26;

    const s=
      .1+
      q*.6;

    ctx.fillStyle=
      "rgba(27,29,24,.9)";

    ctx.beginPath();

    ctx.ellipse(
      x,
      y,
      34*s,
      11*s,
      0,
      0,
      Math.PI*2
    );

    ctx.fill();

    ctx.fillRect(
      x-20*s,
      y-10*s,
      40*s,
      10*s
    );
  }

  dustStorm(
    t,
    1.5
  );

  smokeClouds(
    t,
    1.2
  );
}

/* =========================================================
   SCENE 6 — DAYS
========================================================= */

function sceneDays(t,p){

  /*
    documentary montage:
    map + sky + front
  */

  const cycle=
    Math.floor(
      p*4
    );

  const local=
    (p*4)%1;

  if(cycle%2===0){

    sky(
      "#53616a",
      "#1e2729"
    );

    sun(
      W*.65,
      H*.28,
      H*.28,
      .25
    );

    /*
      moving horizon
    */

    ctx.fillStyle="#3d4035";

    ctx.fillRect(
      0,
      H*.56,
      W,
      H*.44
    );

    smokeClouds(
      t,
      1.3
    );

    dustStorm(
      t,
      1.2
    );

  }else{

    drawMap(
      t,
      local
    );

  }

  /*
    film scratches / light
  */

  ctx.strokeStyle=
    "rgba(255,255,255,.04)";

  for(let i=0;i<8;i++){

    const x=
      (i*143+t*.03)%W;

    ctx.beginPath();

    ctx.moveTo(
      x,
      0
    );

    ctx.lineTo(
      x+20,
      H
    );

    ctx.stroke();
  }
}

/* =========================================================
   SCENE 7 — AFTERMATH / PEACE
========================================================= */

function scenePeace(t,p){

  /*
    sunset
  */

  sky(
    "#b46f4d",
    "#171b1b"
  );

  sun(
    W*.5,
    H*.43,
    H*.3,
    .5
  );

  /*
    quiet water
  */

  ctx.fillStyle="#1e3a40";

  ctx.fillRect(
    0,
    H*.56,
    W,
    H*.44
  );

  for(let i=0;i<70;i++){

    const y=
      H*.58+
      i*H*.005;

    const width=
      30+
      i*4;

    ctx.strokeStyle=
      "rgba(210,190,130,.08)";

    ctx.beginPath();

    ctx.moveTo(
      W/2-width,
      y
    );

    ctx.lineTo(
      W/2+width,
      y
    );

    ctx.stroke();
  }

  /*
    flag begins to appear
  */

  const a=
    smooth(0,.65,p);

  ctx.globalAlpha=a;

  const fx=W*.5;
  const fy=H*.31;
  const fw=Math.min(W*.42,400);
  const fh=fw*.66;

  /*
    pole
  */

  ctx.strokeStyle="#c8b98e";
  ctx.lineWidth=4;

  ctx.beginPath();

  ctx.moveTo(
    fx-fw/2-12,
    fy-45
  );

  ctx.lineTo(
    fx-fw/2-12,
    fy+fh+70
  );

  ctx.stroke();

  /*
    waving Egyptian flag
  */

  const rows=45;

  for(let i=0;i<rows;i++){

    const y=i/rows*fh;

    let c;

    if(i<rows/3){
      c="#b62e34";
    }else if(i<rows*2/3){
      c="#eeeae0";
    }else{
      c="#111";
    }

    ctx.fillStyle=c;

    ctx.beginPath();

    for(let j=0;j<=70;j++){

      const x=j/70*fw;

      const wave=
        Math.sin(
          t*.006+
          j*.25+
          i*.08
        )*8;

      if(j===0){
        ctx.moveTo(
          fx-fw/2+x,
          fy+y+wave
        );
      }else{
        ctx.lineTo(
          fx-fw/2+x,
          fy+y+wave
        );
      }
    }

    for(let j=70;j>=0;j--){

      const x=j/70*fw;

      const wave=
        Math.sin(
          t*.006+
          j*.25+
          (i+1)*.08
        )*8;

      ctx.lineTo(
        fx-fw/2+x,
        fy+y+fh/rows+wave
      );
    }

    ctx.closePath();
    ctx.fill();
  }

  /*
    eagle
  */

  ctx.fillStyle="#d5bd65";

  ctx.beginPath();

  ctx.arc(
    fx,
    fy+fh/2,
    fh*.08,
    0,
    Math.PI*2
  );

  ctx.fill();

  ctx.globalAlpha=1;
}

/* =========================================================
   RENDER
========================================================= */

function render(t){

  ctx.clearRect(
    0,
    0,
    W,
    H
  );

  const index=
    getScene(t);

  const s=
    scenes[index];

  const p=
    clamp(
      (t-s.a)/
      (s.b-s.a),
      0,
      1
    );

  sceneSound(index);

  /*
    captions
  */

  if(
    s.title &&
    index!==0 &&
    index!==8
  ){

    document
      .querySelector("#caption")
      .style.opacity=
      "1";

    document
      .querySelector("#caption .date")
      .textContent=
      s.date;

    document
      .querySelector("#caption .title")
      .textContent=
      s.title;

    document
      .querySelector("#caption .text")
      .textContent=
      s.text;

  }else{

    document
      .querySelector("#caption")
      .style.opacity=
      "0";
  }

  /*
    scenes
  */

  if(index===0)
    sceneIntro(t,p);

  if(index===1)
    sceneBefore(t,p);

  if(index===2)
    sceneBeginning(t,p);

  if(index===3)
    sceneCrossing(t,p);

  if(index===4)
    sceneBarLev(t,p);

  if(index===5)
    sceneBridgehead(t,p);

  if(index===6)
    sceneDays(t,p);

  if(index===7)
    scenePeace(t,p);

  /*
    transitions
  */

  if(p<.12){

    const f=
      1-p/.12;

    ctx.fillStyle=
      `rgba(0,0,0,${f})`;

    ctx.fillRect(
      0,0,W,H
    );
  }

  if(p>.88){

    const f=
      (p-.88)/.12;

    ctx.fillStyle=
      `rgba(0,0,0,${f*.65})`;

    ctx.fillRect(
      0,0,W,H
    );
  }

  /*
    progress
  */

  document
    .getElementById("timelineBar")
    .style.width=
      `${clamp(t/TOTAL,0,1)*100}%`;

  /*
    sound status
  */

  document
    .getElementById("soundBadge")
    .style.opacity=
      audio ? "1" : "0";
}

/* =========================================================
   LOOP
========================================================= */

function loop(now){

  if(!running)return;

  const t=
    (now-startedAt)/1000;

  render(t);

  if(t>=TOTAL){

    running=false;

    document
      .getElementById("end")
      .style.opacity="1";

    return;
  }

  requestAnimationFrame(loop);
}

/* =========================================================
   START
========================================================= */

document
  .getElementById("start")
  .addEventListener(
    "click",
    async()=>{

      initAudio();

      if(audio){

        try{
          await audio.ac.resume();
        }catch(e){}

      }

      running=true;

      startedAt=
        performance.now();

      document
        .getElementById("intro")
        .style.opacity="0";

      setTimeout(()=>{

        document
          .getElementById("intro")
          .style.display="none";

      },1700);

      requestAnimationFrame(loop);
    }
  );

/*
  keep audio unlocked
*/

document.addEventListener(
  "pointerdown",
  ()=>{

    if(
      audio &&
      audio.ac.state==="suspended"
    ){
      audio.ac.resume();
    }

  }
);

/*
  first frame
*/

sceneIntro(0,0);

</script>
