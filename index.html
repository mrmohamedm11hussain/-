<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>٦ أكتوبر | حكاية العبور</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap');

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#020303;
    color:#fff;
    font-family:"Cairo",Tahoma,Arial,sans-serif;
}

body{
    user-select:none;
}

#app{
    position:fixed;
    inset:0;
    overflow:hidden;
    background:#000;
}

/* =========================================================
   BACKGROUND
========================================================= */

#scene{
    position:absolute;
    inset:0;
    overflow:hidden;
    background:#000;
}

.layer{
    position:absolute;
    inset:0;
    pointer-events:none;
}

#sky{
    background:
        radial-gradient(
            circle at 70% 35%,
            rgba(255,177,91,.45),
            transparent 18%
        ),
        linear-gradient(
            180deg,
            #090d10 0%,
            #171d1d 52%,
            #29251e 100%
        );
    transition:background 1s;
}

#stars{
    opacity:.7;
}

.star{
    position:absolute;
    width:2px;
    height:2px;
    border-radius:50%;
    background:#fff;
    box-shadow:0 0 8px rgba(255,255,255,.7);
    animation:twinkle 2s infinite alternate;
}

@keyframes twinkle{
    from{opacity:.15}
    to{opacity:.9}
}

/* =========================================================
   CAMERA
========================================================= */

#camera{
    position:absolute;
    inset:-5%;
    transform:scale(1);
    transition:transform 1.2s cubic-bezier(.2,.8,.2,1);
}

/* =========================================================
   DESERT
========================================================= */

#desert{
    position:absolute;
    left:-10%;
    right:-10%;
    bottom:-10%;
    height:48%;
    background:
        linear-gradient(
            165deg,
            transparent 0 8%,
            rgba(84,70,46,.7) 8% 10%,
            transparent 10% 14%,
            rgba(67,57,41,.8) 14% 17%,
            transparent 17%
        ),
        linear-gradient(
            180deg,
            #6f6047,
            #28251e
        );
    clip-path:polygon(
        0 25%,
        18% 10%,
        40% 18%,
        62% 5%,
        80% 16%,
        100% 8%,
        100% 100%,
        0 100%
    );
}

/* =========================================================
   SUN
========================================================= */

#sun{
    position:absolute;
    width:28vw;
    height:28vw;
    max-width:300px;
    max-height:300px;
    min-width:130px;
    min-height:130px;
    border-radius:50%;
    left:68%;
    top:23%;
    transform:translate(-50%,-50%);
    background:
        radial-gradient(
            circle,
            #ffe4a2 0%,
            #ef9a4a 18%,
            rgba(219,105,54,.25) 50%,
            transparent 70%
        );
    filter:blur(2px);
    opacity:.7;
}

/* =========================================================
   CANAL
========================================================= */

#canal{
    position:absolute;
    left:50%;
    top:46%;
    width:15%;
    height:80%;
    transform:translateX(-50%) perspective(500px) rotateX(5deg);
    background:
        linear-gradient(
            90deg,
            #182f34,
            #426a6b 48%,
            #193238
        );
    box-shadow:
        0 0 70px rgba(45,101,107,.3);
    transition:
        width 1s,
        transform 1s;
}

.waterLine{
    position:absolute;
    width:180%;
    left:-40%;
    height:1px;
    background:rgba(210,220,194,.25);
    animation:water 3s linear infinite;
}

@keyframes water{
    from{transform:translateX(-30%)}
    to{transform:translateX(30%)}
}

/* =========================================================
   SHORE
========================================================= */

.shore{
    position:absolute;
    top:45%;
    height:55%;
    width:38%;
    background:
        linear-gradient(
            180deg,
            #756548,
            #40372a
        );
}

#shoreLeft{
    left:0;
    clip-path:polygon(
        0 0,
        100% 0,
        78% 12%,
        62% 27%,
        42% 46%,
        20% 68%,
        0 100%
    );
}

#shoreRight{
    right:0;
    clip-path:polygon(
        0 12%,
        25% 0,
        100% 0,
        100% 100%,
        80% 68%,
        59% 46%,
        37% 27%
    );
}

/* =========================================================
   BRIDGE
========================================================= */

#bridge{
    position:absolute;
    width:65%;
    height:8px;
    left:50%;
    top:55%;
    transform:translate(-50%,-50%);
    background:
        repeating-linear-gradient(
            90deg,
            #39352c 0 30px,
            #716247 30px 42px
        );
    box-shadow:0 8px 15px #0008;
    opacity:0;
    transition:opacity 1s;
}

/* =========================================================
   LIGHT BEAMS
========================================================= */

.beam{
    position:absolute;
    width:2px;
    height:150%;
    top:-25%;
    background:
        linear-gradient(
            transparent,
            rgba(255,215,145,.16),
            transparent
        );
    transform-origin:center;
    opacity:0;
}

#beam1{
    left:40%;
    transform:rotate(24deg);
}

#beam2{
    left:62%;
    transform:rotate(-18deg);
}

/* =========================================================
   PLANES
========================================================= */

.plane{
    position:absolute;
    width:90px;
    height:25px;
    opacity:0;
    filter:drop-shadow(0 5px 6px #000);
}

.plane:before{
    content:"";
    position:absolute;
    width:85px;
    height:8px;
    top:9px;
    left:0;
    background:#161c1c;
    clip-path:polygon(
        0 50%,
        80% 0,
        100% 50%,
        80% 100%
    );
}

.plane:after{
    content:"";
    position:absolute;
    width:35px;
    height:5px;
    left:15px;
    top:-1px;
    background:#161c1c;
    transform:skewX(-35deg);
}

#plane1{
    top:25%;
    left:-15%;
}

#plane2{
    top:34%;
    right:-15%;
    transform:scale(.65);
}

.fly1{
    animation:fly1 5s linear forwards;
}

.fly2{
    animation:fly2 5s linear forwards;
}

@keyframes fly1{
    0%{left:-15%;opacity:0}
    10%{opacity:.85}
    90%{opacity:.85}
    100%{left:115%;opacity:0}
}

@keyframes fly2{
    0%{right:-15%;opacity:0}
    10%{opacity:.7}
    90%{opacity:.7}
    100%{right:115%;opacity:0}
}

/* =========================================================
   EXPLOSIONS / FLASHES
========================================================= */

.flash{
    position:absolute;
    width:35px;
    height:35px;
    border-radius:50%;
    background:
        radial-gradient(
            circle,
            #fff8cf,
            #ffb23e 25%,
            rgba(210,76,33,.3) 55%,
            transparent 72%
        );
    opacity:0;
}

.flash.go{
    animation:flash .7s ease-out;
}

@keyframes flash{
    0%{opacity:0;transform:scale(.3)}
    12%{opacity:1;transform:scale(1.2)}
    100%{opacity:0;transform:scale(3.5)}
}

/* =========================================================
   SMOKE
========================================================= */

.smoke{
    position:absolute;
    width:80px;
    height:80px;
    border-radius:50%;
    background:
        radial-gradient(
            circle,
            rgba(55,56,52,.75),
            rgba(38,39,36,.35) 45%,
            transparent 70%
        );
    filter:blur(7px);
    opacity:0;
}

.smoke.go{
    animation:smoke 5s ease-out forwards;
}

@keyframes smoke{
    0%{
        opacity:0;
        transform:translate(0,0) scale(.4);
    }
    20%{opacity:.7}
    100%{
        opacity:0;
        transform:translate(30px,-180px) scale(3);
    }
}

/* =========================================================
   SOLDIERS / SILHOUETTES
========================================================= */

.soldier{
    position:absolute;
    width:9px;
    height:34px;
    background:#121615;
    border-radius:5px 5px 1px 1px;
    opacity:0;
}

.soldier:before{
    content:"";
    position:absolute;
    width:11px;
    height:11px;
    border-radius:50%;
    background:#111514;
    top:-9px;
    left:-1px;
}

.soldier:after{
    content:"";
    position:absolute;
    width:25px;
    height:3px;
    background:#111514;
    top:11px;
    left:4px;
    transform:rotate(-18deg);
}

/* =========================================================
   TANKS
========================================================= */

.tank{
    position:absolute;
    width:70px;
    height:30px;
    background:#202722;
    border-radius:7px 7px 4px 4px;
    opacity:0;
}

.tank:before{
    content:"";
    position:absolute;
    width:40px;
    height:20px;
    background:#252d27;
    border-radius:12px 12px 3px 3px;
    left:15px;
    top:-13px;
}

.tank:after{
    content:"";
    position:absolute;
    width:65px;
    height:5px;
    background:#141917;
    left:25px;
    top:-8px;
    transform:rotate(-4deg);
    transform-origin:left;
}

.tank.go{
    animation:tankMove 7s linear forwards;
}

@keyframes tankMove{
    0%{
        transform:translateX(-130px);
        opacity:0;
    }
    10%{opacity:1}
    90%{opacity:1}
    100%{
        transform:translateX(130vw);
        opacity:0;
    }
}

/* =========================================================
   MAP
========================================================= */

#map{
    position:absolute;
    inset:0;
    opacity:0;
    transform:scale(.94);
    transition:
        opacity 1.2s,
        transform 1.5s;
}

.mapEgypt{
    position:absolute;
    width:42%;
    height:55%;
    left:15%;
    top:23%;
    background:#75664a;
    clip-path:polygon(
        5% 0,
        52% 4%,
        71% 18%,
        65% 37%,
        76% 56%,
        52% 77%,
        28% 70%,
        0 92%,
        3% 50%
    );
    box-shadow:0 0 50px rgba(0,0,0,.5);
}

.mapSinai{
    position:absolute;
    width:40%;
    height:43%;
    right:9%;
    top:29%;
    background:#8a7650;
    clip-path:polygon(
        0 17%,
        94% 0,
        100% 79%,
        12% 100%
    );
}

.mapCanal{
    position:absolute;
    width:4px;
    height:42%;
    background:#5f8d91;
    left:56%;
    top:31%;
    box-shadow:0 0 18px #5f8d9166;
}

.mapArrow{
    position:absolute;
    width:24%;
    height:3px;
    background:#c93e3e;
    left:57%;
    top:45%;
    transform-origin:left;
    transform:rotate(8deg) scaleX(0);
    transition:transform 1.5s;
}

.mapArrow:after{
    content:"";
    position:absolute;
    right:-3px;
    top:-5px;
    border-left:12px solid #c93e3e;
    border-top:6px solid transparent;
    border-bottom:6px solid transparent;
}

/* =========================================================
   FLAG
========================================================= */

#flag{
    position:absolute;
    left:50%;
    top:44%;
    transform:translate(-50%,-50%) scale(.6);
    width:min(420px,60vw);
    height:min(270px,38vw);
    opacity:0;
    transition:
        opacity 2s,
        transform 2s;
    filter:drop-shadow(0 20px 30px #000);
}

.flagPole{
    position:absolute;
    left:4%;
    top:-20%;
    width:5px;
    height:150%;
    background:linear-gradient(#e7ddbd,#716b58);
}

.flagCloth{
    position:absolute;
    left:5%;
    top:0;
    width:92%;
    height:100%;
    overflow:hidden;
    box-shadow:0 15px 30px #0008;
}

.flagRed,
.flagWhite,
.flagBlack{
    position:absolute;
    left:0;
    width:100%;
    height:33.33%;
}

.flagRed{
    top:0;
    background:#b92732;
}

.flagWhite{
    top:33.33%;
    background:#eee9df;
}

.flagBlack{
    bottom:0;
    background:#111;
}

.eagle{
    position:absolute;
    left:50%;
    top:50%;
    width:48px;
    height:48px;
    transform:translate(-50%,-50%);
    border-radius:50%;
    background:#d4ad4d;
    opacity:.95;
}

.eagle:before,
.eagle:after{
    content:"";
    position:absolute;
    width:55px;
    height:18px;
    background:#d4ad4d;
    top:16px;
}

.eagle:before{
    right:28px;
    transform:rotate(18deg);
}

.eagle:after{
    left:28px;
    transform:rotate(-18deg);
}

/* =========================================================
   OVERLAY
========================================================= */

#vignette{
    position:absolute;
    inset:0;
    z-index:50;
    pointer-events:none;
    background:
        radial-gradient(
            ellipse,
            transparent 35%,
            rgba(0,0,0,.2) 60%,
            rgba(0,0,0,.9) 120%
        );
}

#grain{
    position:absolute;
    inset:-50%;
    z-index:51;
    pointer-events:none;
    opacity:.045;
    background-image:
        radial-gradient(
            rgba(255,255,255,.8) .7px,
            transparent .8px
        );
    background-size:4px 4px;
    animation:grain .12s steps(2) infinite;
}

@keyframes grain{
    0%{transform:translate(0,0)}
    25%{transform:translate(2%,-1%)}
    50%{transform:translate(-1%,2%)}
    75%{transform:translate(1%,1%)}
    100%{transform:translate(-2%,-1%)}
}

/* =========================================================
   INTRO
========================================================= */

#intro{
    position:absolute;
    inset:0;
    z-index:100;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    flex-direction:column;
    background:
        radial-gradient(
            circle at center,
            #182022,
            #060808 55%,
            #000
        );
    transition:opacity 1.5s;
}

.introSmall{
    color:#c5aa6b;
    font-size:12px;
    letter-spacing:7px;
    margin-bottom:22px;
}

.introDate{
    font-size:
        clamp(60px,15vw,160px);
    font-weight:900;
    line-height:.95;
    letter-spacing:4px;
    text-shadow:
        0 0 60px rgba(255,210,120,.08),
        0 25px 60px #000;
}

.introTitle{
    margin-top:25px;
    font-size:
        clamp(20px,4vw,40px);
    font-weight:700;
    letter-spacing:5px;
}

.introLine{
    width:120px;
    height:1px;
    background:#c6a861;
    margin:32px 0;
}

#start{
    border:1px solid rgba(224,200,143,.55);
    color:#fff;
    background:rgba(255,255,255,.045);
    padding:15px 46px;
    border-radius:100px;
    font-family:inherit;
    font-size:16px;
    cursor:pointer;
    backdrop-filter:blur(12px);
    transition:.35s;
}

#start:hover{
    background:rgba(220,190,120,.12);
    border-color:#e4ca89;
    transform:translateY(-3px);
    box-shadow:0 15px 45px rgba(0,0,0,.35);
}

.introHint{
    margin-top:17px;
    color:#ffffff55;
    font-size:10px;
}

/* =========================================================
   STORY UI
========================================================= */

#story{
    position:absolute;
    z-index:60;
    left:0;
    right:0;
    bottom:8%;
    text-align:center;
    padding:0 7%;
    pointer-events:none;
    transition:opacity .8s;
}

.storyDate{
    color:#d9bd76;
    font-size:11px;
    letter-spacing:4px;
    margin-bottom:12px;
}

.storyTitle{
    font-size:
        clamp(27px,6vw,70px);
    font-weight:900;
    line-height:1.1;
    text-shadow:0 6px 35px #000;
}

.storyText{
    max-width:850px;
    margin:15px auto 0;
    color:#fff;
    font-size:
        clamp(12px,2vw,17px);
    line-height:2;
    text-shadow:0 4px 20px #000;
}

/* =========================================================
   TOP HUD
========================================================= */

#hud{
    position:absolute;
    z-index:70;
    top:18px;
    left:20px;
    right:20px;
    display:flex;
    justify-content:space-between;
    font-size:9px;
    letter-spacing:3px;
    color:#ffffff66;
    pointer-events:none;
}

/* =========================================================
   CONTROLS
========================================================= */

#controls{
    position:absolute;
    z-index:80;
    left:20px;
    bottom:20px;
    display:flex;
    gap:8px;
}

.ctrl{
    width:38px;
    height:38px;
    border:1px solid #ffffff25;
    background:#0005;
    color:#fff;
    border-radius:50%;
    cursor:pointer;
    backdrop-filter:blur(8px);
}

.ctrl:hover{
    background:#ffffff15;
}

#progress{
    position:absolute;
    z-index:80;
    bottom:0;
    left:0;
    right:0;
    height:3px;
    background:#ffffff18;
}

#progressBar{
    height:100%;
    width:0%;
    background:#d2b56d;
    box-shadow:0 0 12px #d2b56d;
}

/* =========================================================
   END
========================================================= */

#ending{
    position:absolute;
    inset:0;
    z-index:200;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    text-align:center;
    background:#000;
    opacity:0;
    pointer-events:none;
    transition:opacity 2s;
}

.endTitle{
    font-size:
        clamp(48px,12vw,145px);
    font-weight:900;
}

.endGold{
    margin-top:20px;
    color:#d4b66c;
    font-size:
        clamp(16px,3vw,28px);
    letter-spacing:5px;
}

.endLine{
    width:130px;
    height:1px;
    background:#a98d51;
    margin:35px;
}

.endText{
    color:#ffffff65;
    font-size:12px;
}

#restart{
    margin-top:35px;
    border:1px solid #ffffff40;
    background:#ffffff08;
    color:#fff;
    border-radius:40px;
    padding:12px 35px;
    font-family:inherit;
    cursor:pointer;
}

/* MOBILE */

@media(max-width:650px){

    #story{
        bottom:11%;
    }

    #canal{
        width:22%;
    }

    .storyText{
        line-height:1.7;
    }

    #controls{
        bottom:12px;
        left:12px;
    }

    #hud{
        top:12px;
        left:12px;
        right:12px;
    }
}
</style>
</head>

<body>

<div id="app">

<div id="scene">

<div id="camera">

<div id="sky" class="layer"></div>

<div id="stars" class="layer"></div>

<div id="sun"></div>

<div id="desert"></div>

<div class="shore" id="shoreLeft"></div>
<div class="shore" id="shoreRight"></div>

<div id="canal">

    <div class="waterLine" style="top:15%"></div>
    <div class="waterLine" style="top:29%"></div>
    <div class="waterLine" style="top:43%"></div>
    <div class="waterLine" style="top:57%"></div>
    <div class="waterLine" style="top:71%"></div>
    <div class="waterLine" style="top:85%"></div>

</div>

<div id="bridge"></div>

<div class="beam" id="beam1"></div>
<div class="beam" id="beam2"></div>

<div class="plane" id="plane1"></div>
<div class="plane" id="plane2"></div>

<div class="flash" id="flash1"></div>
<div class="flash" id="flash2"></div>
<div class="flash" id="flash3"></div>

<div class="smoke" id="smoke1"></div>
<div class="smoke" id="smoke2"></div>
<div class="smoke" id="smoke3"></div>

<div class="tank" id="tank1"></div>
<div class="tank" id="tank2"></div>

<div id="map">

    <div class="mapEgypt"></div>
    <div class="mapSinai"></div>
    <div class="mapCanal"></div>
    <div class="mapArrow"></div>

</div>

<div id="flag">

    <div class="flagPole"></div>

    <div class="flagCloth">
        <div class="flagRed"></div>
        <div class="flagWhite"></div>
        <div class="flagBlack"></div>
        <div class="eagle"></div>
    </div>

</div>

</div>

</div>

<div id="vignette"></div>
<div id="grain"></div>


<!-- INTRO -->

<div id="intro">

    <div class="introSmall">
        مصر • ١٩٧٣
    </div>

    <div class="introDate">
        ٦ أكتوبر
    </div>

    <div class="introTitle">
        حكاية العبور
    </div>

    <div class="introLine"></div>

    <button id="start">
        ابدأ التجربة
    </button>

    <div class="introHint">
        يفضل تشغيل الصوت
    </div>

</div>


<!-- HUD -->

<div id="hud">
    <span>فيلم تفاعلي</span>
    <span>06 • 10 • 1973</span>
</div>


<!-- STORY -->

<div id="story">

    <div class="storyDate" id="storyDate"></div>

    <div class="storyTitle" id="storyTitle"></div>

    <div class="storyText" id="storyText"></div>

</div>


<!-- CONTROLS -->

<div id="controls">

    <button class="ctrl" id="mute">🔊</button>

    <button class="ctrl" id="pause">Ⅱ</button>

</div>


<div id="progress">
    <div id="progressBar"></div>
</div>


<!-- END -->

<div id="ending">

    <div class="endTitle">
        نصر أكتوبر
    </div>

    <div class="endGold">
        السادس من أكتوبر ١٩٧٣
    </div>

    <div class="endLine"></div>

    <div class="endText">
        ذكرى العبور والنصر
    </div>

    <button id="restart">
        إعادة التجربة
    </button>

</div>

</div>


<script>

/* =========================================================
   DATA
========================================================= */

const scenes = [

{
    from:0,
    to:7,
    date:"",
    title:"",
    text:""
},

{
    from:7,
    to:20,
    date:"قبل الحرب",

const TOTAL=120;


/* =========================================================

/* =========================================================
   AUDIO
========================================================= */

let audioCtx=null;
let master=null;
let muted=false;

function initAudio(){

    if(audioCtx)return;

    const AC=
        window.AudioContext ||
        window.webkitAudioContext;

    if(!AC)return;

    audioCtx=new AC();

    master=
        audioCtx.createGain();

    master.gain.value=.18;

    master.connect(
        audioCtx.destination
    );
}

function tone(
    freq,
    duration,
    volume=.04,
    type="sine"
){

    if(!audioCtx || muted)return;

    const osc=
        audioCtx.createOscillator();

    const gain=
        audioCtx.createGain();

    osc.type=type;

    osc.frequency.setValueAtTime(
        freq,
        audioCtx.currentTime
    );

    gain.gain.setValueAtTime(
        .0001,
        audioCtx.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
        volume,
        audioCtx.currentTime+.05
    );

    gain.gain.exponentialRampToValueAtTime(
        .0001,
        audioCtx.currentTime+duration
    );

    osc.connect(gain);

    gain.connect(master);

    osc.start();

    osc.stop(
        audioCtx.currentTime+
        duration+
        .05
    );
}

function boom(){

    if(!audioCtx || muted)return;

    tone(
        42,
        .8,
        .11,
        "sawtooth"
    );

    setTimeout(
        ()=>{
            tone(
                67,
                .5,
                .055,
                "triangle"
            );
        },
        90
    );
}

function whoosh(){

    if(!audioCtx || muted)return;

    const osc=
        audioCtx.createOscillator();

    const gain=
        audioCtx.createGain();

    osc.type="sawtooth";

    osc.frequency.setValueAtTime(
        90,
        audioCtx.currentTime
    );

    osc.frequency.exponentialRampToValueAtTime(
        600,
        audioCtx.currentTime+1
    );

    osc.frequency.exponentialRampToValueAtTime(
        80,
        audioCtx.currentTime+2
    );

    gain.gain.setValueAtTime(
        .0001,
        audioCtx.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
        .05,
        audioCtx.currentTime+.7
    );

    gain.gain.exponentialRampToValueAtTime(
        .0001,
        audioCtx.currentTime+2
    );

    osc.connect(gain);
    gain.connect(master);

    osc.start();

    osc.stop(
        audioCtx.currentTime+2.1
    );
}


/* =========================================================
   STATE
========================================================= */

let playing=false;
let paused=false;
let currentTime=0;
let previousScene=-1;
let lastFrame=0;


/* =========================================================
   SCENE HELPERS
========================================================= */

function getScene(t){

    for(
        let i=0;
        i<scenes.length;
        i++
    ){

        if(
            t>=scenes[i].from &&
            t<scenes[i].to
        ){

            return i;
        }
    }

    return scenes.length-1;
}

function setStory(index){

    const s=
        scenes[index];

    if(
        !s.title
    ){

        story.style.opacity="0";

        return;
    }

    story.style.opacity="0";

    setTimeout(
        ()=>{

            storyDate.textContent=
                s.date;

            storyTitle.textContent=
                s.title;

            storyText.textContent=
                s.text;

            story.style.opacity="1";

        },
        150
    );
}


/* =========================================================
   CAMERA
========================================================= */

function camera(t){

    const scene=
        getScene(t);

    let scale=1;

    if(scene===1)
        scale=1.04;

    if(scene===2)
        scale=1.10;

    if(scene===3)
        scale=1.18;

    if(scene===4)
        scale=1.07;

    if(scene===5)
        scale=1.13;

    if(scene===6)
        scale=1.04;

    if(scene===7)
        scale=1.08;

    document.getElementById(
        "camera"
    ).style.transform=
        `scale(${scale})`;
}


/* =========================================================
   SCENE VISUALS
========================================================= */

function resetVisuals(){

    document.getElementById("map")
        .style.opacity="0";

    document.getElementById("flag")
        .style.opacity="0";

    document.getElementById("bridge")
        .style.opacity="0";

    document.getElementById("beam1")
        .style.opacity="0";

    document.getElementById("beam2")
        .style.opacity="0";

    document.getElementById("canal")
        .style.width="15%";

    document.getElementById("shoreLeft")
        .style.opacity="1";

    document.getElementById("shoreRight")
        .style.opacity="1";

    document.getElementById("sun")
        .style.opacity=".7";

    document.getElementById("desert")
        .style.opacity="1";

    document.getElementById("stars")
        .style.opacity=".7";
}


/* =========================================================
   EFFECT
========================================================= */

function flashAt(id){

    const el=
        document.getElementById(id);

    el.classList.remove("go");

    void el.offsetWidth;

    el.classList.add("go");
}

function smokeAt(id){

    const el=
        document.getElementById(id);

    el.classList.remove("go");

    void el.offsetWidth;

    el.classList.add("go");
}


/* =========================================================
   ANIMATION EVENT
========================================================= */

function sceneEnter(index){

    resetVisuals();

    setStory(index);

    if(index===2){

        whoosh();

        setTimeout(
            ()=>boom(),
            800
        );

        document.getElementById(
            "plane1"
        ).classList.add("fly1");

        document.getElementById(
            "plane2"
        ).classList.add("fly2");
    }

    if(index===3){

        document.getElementById(
            "canal"
        ).style.width="22%";

        document.getElementById(
            "beam1"
        ).style.opacity=".8";

        document.getElementById(
            "beam2"
        ).style.opacity=".7";

        whoosh();

        setTimeout(
            ()=>boom(),
            1200
        );
    }

    if(index===4){

        document.getElementById(
            "bridge"
        ).style.opacity="1";

        flashAt("flash1");

        smokeAt("smoke1");

        setTimeout(
            ()=>boom(),
            400
        );
    }

    if(index===5){

        document.getElementById(
            "bridge"
        ).style.opacity="1";

        document.getElementById(
            "tank1"
        ).classList.add("go");

        document.getElementById(
            "tank2"
        ).classList.add("go");

        smokeAt("smoke2");

        whoosh();
    }

    if(index===6){

        document.getElementById(
            "map"
        ).style.opacity="1";

        setTimeout(
            ()=>{
                document.querySelector(
                    ".mapArrow"
                ).style.transform=
                    "rotate(8deg) scaleX(1)";
            },
            300
        );

        tone(
            130,
            1.5,
            .035,
            "triangle"
        );
    }

    if(index===7){

        document.getElementById(
            "flag"
        ).style.opacity="1";

        document.getElementById(
            "flag"
        ).style.transform=
            "translate(-50%,-50%) scale(1)";

        tone(
            65,
            3,
            .04,
            "triangle"
        );
    }
}


/* =========================================================
   FRAME
========================================================= */

function frame(now){

    if(!playing)
        return;

    if(paused){

        lastFrame=now;

        requestAnimationFrame(frame);

        return;
    }

    const delta=
        (now-lastFrame)/1000;

    lastFrame=now;

    currentTime+=delta;

    if(
        currentTime>=TOTAL
    ){

        currentTime=TOTAL;

        finish();

        return;
    }

    const scene=
        getScene(currentTime);

    if(scene!==previousScene){

        previousScene=scene;

        sceneEnter(scene);
    }

    camera(currentTime);

    progress.style.width=
        (
            currentTime/TOTAL*100
        )+"%";

    requestAnimationFrame(frame);
}


/* =========================================================
   START
========================================================= */

document.getElementById(
    "start"
).addEventListener(
    "click",
    async ()=>{

        initAudio();

        if(audioCtx){

            try{
                await audioCtx.resume();
            }catch(e){}
        }

        playing=true;

        paused=false;

        currentTime=0;

        previousScene=-1;

        intro.style.opacity="0";

        setTimeout(
            ()=>{
                intro.style.display="none";
            },
            1500
        );

        lastFrame=
            performance.now();

        requestAnimationFrame(frame);
    }
);


/* =========================================================
   PAUSE
========================================================= */

pauseBtn.addEventListener(
    "click",
    ()=>{

        if(!playing)return;

        paused=!paused;

        pauseBtn.textContent=
            paused ? "▶" : "Ⅱ";
    }
);


/* =========================================================
   MUTE
========================================================= */

muteBtn.addEventListener(
    "click",
    ()=>{

        muted=!muted;

        muteBtn.textContent=
            muted ? "🔇" : "🔊";

        if(master){

            master.gain.value=
                muted ? 0 : .18;
        }
    }
);


/* =========================================================
   FINISH
========================================================= */

function finish(){

    playing=false;

    story.style.opacity="0";

    progress.style.width="100%";

    ending.style.opacity="1";

    ending.style.pointerEvents="auto";
}


/* =========================================================
   RESTART
========================================================= */

document.getElementById(
    "restart"
).addEventListener(
    "click",
    ()=>{

        ending.style.opacity="0";

        ending.style.pointerEvents="none";

        document.getElementById(
            "plane1"
        ).classList.remove("fly1");

        document.getElementById(
            "plane2"
        ).classList.remove("fly2");

        document.getElementById(
            "tank1"
        ).classList.remove("go");

        document.getElementById(
            "tank2"
        ).classList.remove("go");

        document.querySelector(
            ".mapArrow"
        ).style.transform=
            "rotate(8deg) scaleX(0)";

        intro.style.display="flex";

        intro.style.opacity="1";

        resetVisuals();

        progress.style.width="0%";
    }
);


/* =========================================================
   KEYBOARD
========================================================= */

document.addEventListener(
    "keydown",
    e=>{

        if(e.code==="Space"){

            e.preventDefault();

            pauseBtn.click();
        }

        if(e.key==="m"){

            muteBtn.click();
        }
    }
);

</script>
