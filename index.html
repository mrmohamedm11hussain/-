<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>نصر أكتوبر — فيلم تفاعلي</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#020406;
  font-family:"Tahoma","Arial",sans-serif;
}

body{
  color:#fff;
}

#film{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  background:#020406;
}

canvas{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  display:block;
}

#grain{
  position:absolute;
  inset:-50%;
  pointer-events:none;
  opacity:.055;
  background-image:
    repeating-radial-gradient(
      circle at 30% 20%,
      rgba(255,255,255,.6) 0 1px,
      transparent 1px 4px
    );
  animation:grain .18s steps(2) infinite;
}

@keyframes grain{
  0%{transform:translate(0,0)}
  25%{transform:translate(2%, -1%)}
  50%{transform:translate(-1%, 2%)}
  75%{transform:translate(1%,1%)}
  100%{transform:translate(-2%,-1%)}
}

#vignette{
  position:absolute;
  inset:0;
  pointer-events:none;
  background:
    radial-gradient(
      ellipse at center,
      transparent 35%,
      rgba(0,0,0,.28) 65%,
      rgba(0,0,0,.88) 125%
    );
}

#hud{
  position:absolute;
  top:22px;
  left:22px;
  right:22px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  pointer-events:none;
  opacity:.8;
  font-size:11px;
  letter-spacing:2px;
  color:rgba(255,255,255,.7);
}

#progress{
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  height:3px;
  background:rgba(255,255,255,.08);
}

#bar{
  height:100%;
  width:0%;
  background:linear-gradient(90deg,#c7a44a,#fff,#c7a44a);
  box-shadow:0 0 12px rgba(255,220,130,.7);
}

#intro{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  text-align:center;
  background:#020406;
  z-index:10;
  transition:opacity 1.5s ease;
}

#intro .date{
  font-size:clamp(48px,12vw,130px);
  font-weight:900;
  letter-spacing:8px;
  text-shadow:0 0 40px rgba(255,220,130,.12);
}

#intro .sub{
  margin-top:18px;
  font-size:clamp(15px,3vw,24px);
  letter-spacing:5px;
  color:#c7b98d;
}

#start{
  margin-top:55px;
  border:1px solid rgba(255,255,255,.35);
  background:rgba(255,255,255,.04);
  color:#fff;
  padding:15px 42px;
  border-radius:50px;
  font-size:15px;
  cursor:pointer;
  backdrop-filter:blur(12px);
  transition:.3s;
}

#start:hover{
  background:rgba(255,255,255,.12);
  transform:scale(1.04);
}

#caption{
  position:absolute;
  left:50%;
  bottom:9%;
  transform:translateX(-50%);
  text-align:center;
  width:90%;
  pointer-events:none;
  opacity:0;
  transition:opacity 1s;
}

#caption .small{
  font-size:12px;
  letter-spacing:4px;
  color:#c8b98b;
  margin-bottom:10px;
}

#caption .big{
  font-size:clamp(25px,5vw,58px);
  font-weight:800;
  text-shadow:0 4px 25px #000;
}

#end{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  text-align:center;
  background:#000;
  opacity:0;
  pointer-events:none;
  transition:opacity 2s;
  z-index:8;
}

#end .title{
  font-size:clamp(42px,10vw,110px);
  font-weight:900;
}

#end .date{
  margin-top:18px;
  font-size:clamp(17px,3vw,28px);
  color:#c9b887;
  letter-spacing:4px;
}

#end .line{
  width:120px;
  height:1px;
  background:#b99a52;
  margin:35px 0;
}

#end .credit{
  font-size:12px;
  color:rgba(255,255,255,.55);
  letter-spacing:2px;
}

@media(max-width:600px){
  #hud{
    top:12px;
    left:12px;
    right:12px;
  }
}
</style>
</head>

<body>

<div id="film">

<canvas id="scene"></canvas>

<div id="grain"></div>
<div id="vignette"></div>

<div id="hud">
  <span>06 · 10 · 1973</span>
  <span>فيلم تفاعلي</span>
</div>

<div id="caption">
  <div class="small"></div>
  <div class="big"></div>
</div>

<div id="progress">
  <div id="bar"></div>
</div>

<div id="intro">
  <div class="date">06.10.1973</div>
  <div class="sub">حين عبرت الإرادة</div>
  <button id="start">ابدأ الفيلم</button>
</div>

<div id="end">
  <div class="title">نصر أكتوبر</div>
  <div class="line"></div>
  <div class="date">السادس من أكتوبر ١٩٧٣</div>
  <div class="credit">ذكرى العبور والنصر</div>
</div>

</div>

<script>
"use strict";

/* =========================================================
   OCTOBER 1973 — CINEMATIC BROWSER FILM
   Single file / GitHub Pages / No external assets
========================================================= */

const canvas = document.getElementById("scene");
const ctx = canvas.getContext("2d");

const intro = document.getElementById("intro");
const startBtn = document.getElementById("start");
const caption = document.getElementById("caption");
const captionSmall = caption.querySelector(".small");
const captionBig = caption.querySelector(".big");
const endScreen = document.getElementById("end");
const progressBar = document.getElementById("bar");

let W = 0;
let H = 0;
let DPR = 1;

function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 1.6);

  W = window.innerWidth;
  H = window.innerHeight;

  canvas.width = W * DPR;
  canvas.height = H * DPR;

  ctx.setTransform(DPR,0,0,DPR,0,0);
}

window.addEventListener("resize",resize);
resize();

/* =========================================================
   AUDIO ENGINE
========================================================= */

let audio = null;

function createAudio(){

  if(audio) return;

  const AudioContext =
    window.AudioContext ||
    window.webkitAudioContext;

  if(!AudioContext) return;

  const ac = new AudioContext();

  const master = ac.createGain();
  master.gain.value = .22;
  master.connect(ac.destination);

  audio = {ac,master};

  /*
    Deep cinematic drone
  */

  const osc = ac.createOscillator();
  const gain = ac.createGain();

  osc.type = "sine";
  osc.frequency.value = 42;
  gain.gain.value = .025;

  osc.connect(gain);
  gain.connect(master);

  osc.start();

  /*
    Second low layer
  */

  const osc2 = ac.createOscillator();
  const gain2 = ac.createGain();

  osc2.type = "triangle";
  osc2.frequency.value = 67;
  gain2.gain.value = .008;

  osc2.connect(gain2);
  gain2.connect(master);
  osc2.start();

  audio.drone = gain;
}

function soundTone(freq,duration,type="sine",volume=.08){

  if(!audio) return;

  const ac = audio.ac;

  const osc = ac.createOscillator();
  const gain = ac.createGain();

  osc.type = type;
  osc.frequency.setValueAtTime(freq,ac.currentTime);

  gain.gain.setValueAtTime(.0001,ac.currentTime);

  gain.gain.exponentialRampToValueAtTime(
    volume,
    ac.currentTime+.025
  );

  gain.gain.exponentialRampToValueAtTime(
    .0001,
    ac.currentTime+duration
  );

  osc.connect(gain);
  gain.connect(audio.master);

  osc.start();
  osc.stop(ac.currentTime+duration+.05);
}

function engineSound(){

  if(!audio) return;

  const ac = audio.ac;

  const osc = ac.createOscillator();
  const gain = ac.createGain();

  osc.type="sawtooth";

  osc.frequency.setValueAtTime(45,ac.currentTime);
  osc.frequency.linearRampToValueAtTime(
    72,
    ac.currentTime+1.7
  );

  gain.gain.setValueAtTime(.0001,ac.currentTime);

  gain.gain.exponentialRampToValueAtTime(
    .045,
    ac.currentTime+.15
  );

  gain.gain.exponentialRampToValueAtTime(
    .0001,
    ac.currentTime+1.9
  );

  osc.connect(gain);
  gain.connect(audio.master);

  osc.start();
  osc.stop(ac.currentTime+2);
}

function flybySound(){

  if(!audio) return;

  const ac = audio.ac;

  const osc = ac.createOscillator();
  const gain = ac.createGain();

  osc.type="sawtooth";

  osc.frequency.setValueAtTime(
    180,
    ac.currentTime
  );

  osc.frequency.exponentialRampToValueAtTime(
    900,
    ac.currentTime+.8
  );

  osc.frequency.exponentialRampToValueAtTime(
    110,
    ac.currentTime+1.7
  );

  gain.gain.setValueAtTime(.0001,ac.currentTime);

  gain.gain.exponentialRampToValueAtTime(
    .13,
    ac.currentTime+.75
  );

  gain.gain.exponentialRampToValueAtTime(
    .0001,
    ac.currentTime+1.8
  );

  osc.connect(gain);
  gain.connect(audio.master);

  osc.start();
  osc.stop(ac.currentTime+2);
}

function impactSound(){

  if(!audio) return;

  soundTone(55,.65,"sawtooth",.13);

  setTimeout(()=>{
    soundTone(90,.35,"triangle",.08);
  },100);
}

function waterSound(){

  if(!audio) return;

  soundTone(130,.8,"sine",.025);
}

/* =========================================================
   PARTICLES
========================================================= */

const stars = [];
const dust = [];
const smoke = [];
const sparks = [];
const birds = [];

for(let i=0;i<170;i++){

  stars.push({
    x:Math.random(),
    y:Math.random()*.68,
    a:.2+Math.random()*.8,
    s:.4+Math.random()*1.8
  });

}

for(let i=0;i<100;i++){

  dust.push({
    x:Math.random(),
    y:Math.random(),
    z:Math.random(),
    vx:-.3-Math.random()*.7,
    vy:(Math.random()-.5)*.15,
    life:Math.random()
  });

}

for(let i=0;i<45;i++){

  smoke.push({
    x:Math.random(),
    y:Math.random(),
    r:15+Math.random()*55,
    a:.05+Math.random()*.12
  });

}

for(let i=0;i<35;i++){

  sparks.push({
    x:Math.random(),
    y:Math.random(),
    vx:(Math.random()-.5)*3,
    vy:-Math.random()*3,
    life:Math.random()
  });

}

for(let i=0;i<12;i++){

  birds.push({
    x:Math.random(),
    y:.12+Math.random()*.35,
    speed:.15+Math.random()*.25,
    phase:Math.random()*Math.PI*2
  });

}

/* =========================================================
   UTILS
========================================================= */

function clamp(v,a,b){
  return Math.max(a,Math.min(b,v));
}

function lerp(a,b,t){
  return a+(b-a)*t;
}

function ease(t){
  return t*t*(3-2*t);
}

function smoothstep(a,b,t){

  t=clamp((t-a)/(b-a),0,1);

  return ease(t);
}

function rand(min,max){
  return min+Math.random()*(max-min);
}

/* =========================================================
   CAMERA
========================================================= */

const camera = {
  x:0,
  y:0,
  zoom:1,
  shake:0
};

function beginCamera(){

  ctx.save();

  const sx =
    (Math.random()-.5) *
    camera.shake;

  const sy =
    (Math.random()-.5) *
    camera.shake;

  ctx.translate(
    W/2+sx,
    H/2+sy
  );

  ctx.scale(
    camera.zoom,
    camera.zoom
  );

  ctx.translate(
    -W/2-camera.x,
    -H/2-camera.y
  );
}

function endCamera(){
  ctx.restore();
}

/* =========================================================
   SKY
========================================================= */

function drawSky(top,bottom){

  const g=ctx.createLinearGradient(
    0,0,0,H
  );

  g.addColorStop(0,top);
  g.addColorStop(1,bottom);

  ctx.fillStyle=g;
  ctx.fillRect(0,0,W,H);
}

function drawSun(x,y,r,alpha=1){

  const g=ctx.createRadialGradient(
    x,y,0,
    x,y,r
  );

  g.addColorStop(
    0,
    `rgba(255,239,181,${.9*alpha})`
  );

  g.addColorStop(
    .25,
    `rgba(255,191,92,${.28*alpha})`
  );

  g.addColorStop(
    1,
    "rgba(255,150,50,0)"
  );

  ctx.fillStyle=g;

  ctx.beginPath();
  ctx.arc(x,y,r,0,Math.PI*2);
  ctx.fill();
}

/* =========================================================
   STARS
========================================================= */

function drawStars(t){

  for(const s of stars){

    const twinkle =
      .55+
      Math.sin(t*s.s+s.x*30)*.35;

    ctx.fillStyle=
      `rgba(255,255,255,${s.a*twinkle})`;

    ctx.beginPath();

    ctx.arc(
      s.x*W,
      s.y*H,
      s.s*.45,
      0,
      Math.PI*2
    );

    ctx.fill();
  }
}

/* =========================================================
   CLOUDS
========================================================= */

function cloud(x,y,scale,alpha=.3){

  ctx.save();

  ctx.globalAlpha=alpha;

  ctx.fillStyle="#d9d8d1";

  const p=[
    [-90,15,50],
    [-45,-5,65],
    [10,-18,75],
    [65,0,58],
    [105,18,42]
  ];

  ctx.beginPath();

  for(const q of p){

    ctx.moveTo(
      x+q[0]*scale+q[2]*scale,
      y+q[1]*scale
    );

    ctx.arc(
      x+q[0]*scale,
      y+q[1]*scale,
      q[2]*scale,
      0,
      Math.PI*2
    );
  }

  ctx.fill();

  ctx.restore();
}

function drawClouds(t){

  cloud(
    W*.18 + Math.sin(t*.015)*35,
    H*.19,
    1.1,
    .11
  );

  cloud(
    W*.65 - (t*.7%180),
    H*.26,
    .75,
    .10
  );

  cloud(
    W*.82 - (t*.35%240),
    H*.14,
    .9,
    .08
  );
}

/* =========================================================
   MOON
========================================================= */

function drawMoon(){

  const x=W*.78;
  const y=H*.2;

  ctx.save();

  ctx.shadowColor="rgba(230,240,255,.5)";
  ctx.shadowBlur=30;

  ctx.fillStyle="#e7e7d2";

  ctx.beginPath();

  ctx.arc(
    x,y,
    Math.min(W,H)*.055,
    0,
    Math.PI*2
  );

  ctx.fill();

  ctx.shadowBlur=0;

  ctx.fillStyle="rgba(10,16,25,.8)";

  ctx.beginPath();

  ctx.arc(
    x+13,
    y-7,
    Math.min(W,H)*.052,
    0,
    Math.PI*2
  );

  ctx.fill();

  ctx.restore();
}

/* =========================================================
   MOUNTAINS / LAND
========================================================= */

function mountains(y,alpha,offset=0){

  ctx.save();

  ctx.globalAlpha=alpha;

  ctx.fillStyle="#101922";

  ctx.beginPath();

  ctx.moveTo(-50,H);

  for(let x=-50;x<=W+100;x+=70){

    const h =
      35+
      Math.sin((x+offset)*.012)*30+
      Math.sin((x+offset)*.031)*15;

    ctx.lineTo(x,y-h);
  }

  ctx.lineTo(W+100,H);
  ctx.closePath();

  ctx.fill();

  ctx.restore();
}

/* =========================================================
   CANAL
========================================================= */

function drawCanal(t){

  const horizon=H*.48;

  /* land */

  ctx.fillStyle="#77704e";

  ctx.fillRect(
    0,
    horizon,
    W,
    H-horizon
  );

  /* distant land */

  mountains(
    horizon+18,
    .5,
    t*5
  );

  /*
    Canal perspective
  */

  ctx.beginPath();

  ctx.moveTo(W*.46,horizon);
  ctx.lineTo(W*.54,horizon);
  ctx.lineTo(W*.95,H);
  ctx.lineTo(W*.05,H);

  ctx.closePath();

  const water=
    ctx.createLinearGradient(
      0,horizon,
      0,H
    );

  water.addColorStop(0,"#263c45");
  water.addColorStop(.45,"#18333d");
  water.addColorStop(1,"#071820");

  ctx.fillStyle=water;
  ctx.fill();

  /* shoreline */

  ctx.strokeStyle="rgba(221,196,130,.28)";
  ctx.lineWidth=2;

  ctx.beginPath();

  ctx.moveTo(W*.46,horizon);
  ctx.lineTo(W*.05,H);

  ctx.moveTo(W*.54,horizon);
  ctx.lineTo(W*.95,H);

  ctx.stroke();

  /* water reflections */

  ctx.save();

  ctx.globalAlpha=.22;

  for(let i=0;i<80;i++){

    const p=(i/80);

    const y=
      horizon+
      Math.pow(p,1.7)*(H-horizon);

    const width=
      lerp(5,180,p);

    const center=W/2;

    const drift=
      Math.sin(t*.015+i)*20;

    ctx.strokeStyle=
      i%2
      ? "#94a7a0"
      : "#6d8b86";

    ctx.lineWidth=1;

    ctx.beginPath();

    ctx.moveTo(
      center-width+drift,
      y
    );

    ctx.lineTo(
      center+width+drift,
      y
    );

    ctx.stroke();
  }

  ctx.restore();

  /* crossing bridge silhouette */

  ctx.strokeStyle="rgba(30,31,27,.8)";
  ctx.lineWidth=5;

  ctx.beginPath();

  ctx.moveTo(W*.17,horizon+5);
  ctx.lineTo(W*.83,horizon+5);

  ctx.stroke();

  for(let x=.2;x<.85;x+=.12){

    ctx.beginPath();

    ctx.moveTo(W*x,horizon+5);
    ctx.lineTo(W*x,H*.62);

    ctx.stroke();
  }
}

/* =========================================================
   BOATS / CROSSING SILHOUETTES
========================================================= */

function boat(x,y,s,dir=1){

  ctx.save();

  ctx.translate(x,y);
  ctx.scale(s*dir,s);

  ctx.fillStyle="#101313";

  ctx.beginPath();

  ctx.moveTo(-50,0);
  ctx.lineTo(35,0);
  ctx.lineTo(50,-8);
  ctx.lineTo(28,10);
  ctx.lineTo(-42,10);
  ctx.closePath();

  ctx.fill();

  ctx.fillRect(-18,-18,38,18);

  ctx.fillRect(-8,-28,15,12);

  ctx.strokeStyle="#161919";
  ctx.lineWidth=3;

  ctx.beginPath();
  ctx.moveTo(0,-28);
  ctx.lineTo(0,-55);
  ctx.stroke();

  ctx.restore();
}

function drawBoats(t){

  const y=H*.61;

  boat(
    W*.43+Math.sin(t*.002)*18,
    y,
    .8,
    1
  );

  boat(
    W*.57-Math.sin(t*.0017)*20,
    y+H*.06,
    1.15,
    -1
  );

  boat(
    W*.48+Math.sin(t*.001)*30,
    y+H*.15,
    1.5,
    1
  );
}

/* =========================================================
   PLANES
========================================================= */

function plane(x,y,s,angle=0,alpha=1){

  ctx.save();

  ctx.translate(x,y);
  ctx.rotate(angle);
  ctx.scale(s,s);

  ctx.globalAlpha=alpha;

  /* shadow */

  ctx.shadowColor="rgba(0,0,0,.7)";
  ctx.shadowBlur=15;

  /* body */

  ctx.fillStyle="#1b2224";

  ctx.beginPath();

  ctx.moveTo(80,0);
  ctx.lineTo(10,-7);
  ctx.lineTo(-55,-5);
  ctx.lineTo(-80,0);
  ctx.lineTo(-55,5);
  ctx.lineTo(10,7);
  ctx.closePath();

  ctx.fill();

  /* wings */

  ctx.beginPath();

  ctx.moveTo(20,-3);
  ctx.lineTo(-15,-55);
  ctx.lineTo(-2,-57);
  ctx.lineTo(45,-5);

  ctx.moveTo(20,3);
  ctx.lineTo(-15,55);
  ctx.lineTo(-2,57);
  ctx.lineTo(45,5);

  ctx.fill();

  /* tail */

  ctx.beginPath();

  ctx.moveTo(-48,-4);
  ctx.lineTo(-70,-27);
  ctx.lineTo(-62,-29);
  ctx.lineTo(-35,-3);

  ctx.moveTo(-48,4);
  ctx.lineTo(-70,27);
  ctx.lineTo(-62,29);
  ctx.lineTo(-35,3);

  ctx.fill();

  /* engine glow */

  ctx.shadowBlur=20;
  ctx.fillStyle="rgba(255,140,50,.8)";

  ctx.beginPath();
  ctx.ellipse(
    -75,0,
    10,3,
    0,
    0,
    Math.PI*2
  );

  ctx.fill();

  ctx.restore();
}

/* =========================================================
   TANK
========================================================= */

function tank(x,y,s,angle=0,alpha=1){

  ctx.save();

  ctx.translate(x,y);
  ctx.rotate(angle);
  ctx.scale(s,s);

  ctx.globalAlpha=alpha;

  /* shadow */

  ctx.fillStyle="rgba(0,0,0,.5)";

  ctx.beginPath();

  ctx.ellipse(
    0,
    24,
    100,
    18,
    0,
    0,
    Math.PI*2
  );

  ctx.fill();

  /* tracks */

  ctx.fillStyle="#161817";

  ctx.fillRect(-82,4,164,30);

  /* wheels */

  ctx.fillStyle="#2a2b27";

  for(let i=-65;i<=65;i+=25){

    ctx.beginPath();

    ctx.arc(i,19,10,0,Math.PI*2);

    ctx.fill();
  }

  /* body */

  ctx.fillStyle="#3c4036";

  ctx.beginPath();

  ctx.moveTo(-65,-10);
  ctx.lineTo(-45,-38);
  ctx.lineTo(55,-38);
  ctx.lineTo(72,-10);
  ctx.lineTo(55,10);
  ctx.lineTo(-58,10);
  ctx.closePath();

  ctx.fill();

  /* turret */

  ctx.fillStyle="#4a4c3d";

  ctx.beginPath();

  ctx.arc(
    0,
    -38,
    28,
    Math.PI,
    Math.PI*2
  );

  ctx.fill();

  /* cannon */

  ctx.strokeStyle="#292b26";
  ctx.lineWidth=12;

  ctx.beginPath();

  ctx.moveTo(15,-43);
  ctx.lineTo(105,-54);

  ctx.stroke();

  ctx.restore();
}

/* =========================================================
   DUST
========================================================= */

function drawDust(t,intensity=1){

  ctx.save();

  for(let i=0;i<120;i++){

    const x =
      (i*73+t*.4)%(
        W+300
      )-150;

    const y =
      H*.65+
      Math.sin(i*1.7+t*.003)*H*.12+
      Math.random()*H*.15;

    const r =
      5+
      ((i*17)%35)*intensity;

    ctx.fillStyle=
      `rgba(181,157,108,${.015+.035*intensity})`;

    ctx.beginPath();

    ctx.arc(x,y,r,0,Math.PI*2);

    ctx.fill();
  }

  ctx.restore();
}

/* =========================================================
   SMOKE
========================================================= */

function drawSmoke(t,intensity=1){

  ctx.save();

  for(let i=0;i<30;i++){

    const p=(i/30);

    const x=
      W*.52+
      Math.sin(i*2.3+t*.001)*70+
      p*90;

    const y=
      H*.63-
      p*H*.34+
      Math.sin(t*.001+i)*10;

    const r=
      15+p*70;

    const g=ctx.createRadialGradient(
      x,y,0,
      x,y,r
    );

    g.addColorStop(
      0,
      `rgba(65,66,59,${.13*intensity*(1-p)})`
    );

    g.addColorStop(
      1,
      "rgba(30,30,28,0)"
    );

    ctx.fillStyle=g;

    ctx.beginPath();
    ctx.arc(x,y,r,0,Math.PI*2);
    ctx.fill();
  }

  ctx.restore();
}

/* =========================================================
   LIGHT TRAILS
========================================================= */

function lightTrail(
  x,
  y,
  dx,
  dy,
  length,
  alpha=1
){

  const g=ctx.createLinearGradient(
    x,y,
    x-dx*length,
    y-dy*length
  );

  g.addColorStop(
    0,
    `rgba(255,240,180,${alpha})`
  );

  g.addColorStop(
    .35,
    `rgba(255,180,80,${alpha*.55})`
  );

  g.addColorStop(
    1,
    "rgba(255,100,30,0)"
  );

  ctx.strokeStyle=g;
  ctx.lineWidth=2;

  ctx.beginPath();

  ctx.moveTo(x,y);

  ctx.lineTo(
    x-dx*length,
    y-dy*length
  );

  ctx.stroke();
}

/* =========================================================
   FLAG — WAVING
========================================================= */

function drawFlag(t){

  const x=W*.5;
  const y=H*.29;
  const width=Math.min(W*.38,360);
  const height=width*.66;

  ctx.save();

  ctx.translate(x-width/2,y);

  /* pole */

  ctx.strokeStyle="#b6aa91";
  ctx.lineWidth=4;

  ctx.beginPath();

  ctx.moveTo(-12,-40);
  ctx.lineTo(-12,height+65);

  ctx.stroke();

  const rows=24;

  for(let i=0;i<rows;i++){

    const yy=i/rows*height;

    const color=
      i<rows/3
      ? "#b92b2f"
      : i<rows*2/3
      ? "#f0f0e8"
      : "#111";

    ctx.fillStyle=color;

    ctx.beginPath();

    for(let j=0;j<=40;j++){

      const xx=j/40*width;

      const wave=
        Math.sin(
          t*.006+
          j*.33+
          i*.1
        )*8;

      if(j===0){
        ctx.moveTo(xx,yy+wave);
      }else{
        ctx.lineTo(xx,yy+wave);
      }
    }

    for(let j=40;j>=0;j--){

      const xx=j/40*width;

      const wave=
        Math.sin(
          t*.006+
          j*.33+
          (i+1)*.1
        )*8;

      ctx.lineTo(
        xx,
        yy+height/rows+wave
      );
    }

    ctx.closePath();
    ctx.fill();
  }

  /* eagle */

  ctx.fillStyle="#d5bd63";

  ctx.beginPath();

  ctx.arc(
    width*.5,
    height*.5,
    height*.09,
    0,
    Math.PI*2
  );

  ctx.fill();

  ctx.restore();
}

/* =========================================================
   BIRDS
========================================================= */

function drawBirds(t){

  ctx.strokeStyle="rgba(15,20,21,.65)";
  ctx.lineWidth=2;

  for(const b of birds){

    const x=
      ((b.x*W+t*b.speed)%(
        W+120
      ))-60;

    const y=
      b.y*H+
      Math.sin(t*.003+b.phase)*8;

    const wing=
      Math.sin(t*.015+b.phase)*7;

    ctx.beginPath();

    ctx.moveTo(x-8,y);
    ctx.quadraticCurveTo(
      x-3,
      y-wing,
      x,
      y
    );

    ctx.quadraticCurveTo(
      x+4,
      y-wing,
      x+9,
      y
    );

    ctx.stroke();
  }
}

/* =========================================================
   SCENE SYSTEM
========================================================= */

const scenes = [

  {
    start:0,
    end:6,
    name:"البداية",
    small:"",
    big:""
  },

  {
    start:6,
    end:16,
    name:"السماء",
    small:"ليلة العبور",
    big:"كانت لحظة مختلفة..."
  },

  {
    start:16,
    end:23,
    name:"التحليق",
    small:"السادس من أكتوبر",
    big:"حين بدأت السماء تتحرك"
  },

  {
    start:23,
    end:34,
    name:"القناة",
    small:"قناة السويس",
    big:"وعبر الرجال الماء"
  },

  {
    start:34,
    end:45,
    name:"العبور",
    small:"إرادة لا تتوقف",
    big:"من هنا بدأ العبور"
  },

  {
    start:45,
    end:55,
    name:"اللحظة",
    small:"أكتوبر ١٩٧٣",
    big:"وارتفع العلم"
  },

  {
    start:55,
    end:63,
    name:"النهاية",
    small:"",
    big:""
  }
];

const TOTAL=63;

let started=false;
let startTime=0;
let lastTime=0;
let sceneTriggered={};

function currentScene(t){

  for(let i=0;i<scenes.length;i++){

    if(
      t>=scenes[i].start &&
      t<scenes[i].end
    ){
      return i;
    }
  }

  return scenes.length-1;
}

/* =========================================================
   SPECIAL SCENE SOUNDS
========================================================= */

function triggerSceneSound(index){

  if(sceneTriggered[index]) return;

  sceneTriggered[index]=true;

  if(index===1){

    soundTone(
      58,
      2.8,
      "sine",
      .06
    );

  }

  if(index===2){

    flybySound();

  }

  if(index===3){

    waterSound();

  }

  if(index===4){

    engineSound();

    setTimeout(
      impactSound,
      900
    );

  }

  if(index===5){

    soundTone(
      72,
      3,
      "triangle",
      .06
    );

  }
}

/* =========================================================
   SCENE 1 — NIGHT
========================================================= */

function sceneNight(t,p){

  drawSky(
    "#03070d",
    "#0d1720"
  );

  drawStars(t);
  drawMoon();

  /* distant haze */

  const haze=
    ctx.createLinearGradient(
      0,H*.45,
      0,H
    );

  haze.addColorStop(
    0,
    "rgba(20,40,45,.1)"
  );

  haze.addColorStop(
    1,
    "rgba(0,0,0,.9)"
  );

  ctx.fillStyle=haze;
  ctx.fillRect(0,0,W,H);

  mountains(
    H*.64,
    .8,
    t*2
  );

  /* distant moving lights */

  for(let i=0;i<5;i++){

    const x=
      ((i*W*.3+t*20)%
      (W+200))-100;

    const y=
      H*.28+i*H*.025;

    ctx.fillStyle=
      "rgba(255,220,150,.35)";

    ctx.beginPath();

    ctx.arc(
      x,
      y,
      2,
      0,
      Math.PI*2
    );

    ctx.fill();
  }

  /* planes approaching */

  const approach=
    smoothstep(0,.85,p);

  plane(
    W*.15+
    approach*W*.62,
    H*.28-
    approach*H*.08,
    .32+
    approach*.7,
    -.05,
    .9
  );

  plane(
    W*.05+
    approach*W*.58,
    H*.34-
    approach*H*.05,
    .2+
    approach*.45,
    -.03,
    .65
  );

  plane(
    W*.25+
    approach*W*.55,
    H*.39,
    .16+
    approach*.35,
    .02,
    .5
  );
}

/* =========================================================
   SCENE 2 — FLYBY
========================================================= */

function sceneFlyby(t,p){

  drawSky(
    "#101b27",
    "#b06e45"
  );

  drawClouds(t);

  drawSun(
    W*.72,
    H*.32,
    H*.25,
    smoothstep(0,.7,p)
  );

  mountains(
    H*.68,
    .45,
    t*7
  );

  drawBirds(t);

  /*
    Plane comes toward camera.
  */

  const q=smoothstep(0,.82,p);

  const x=
    lerp(-W*.25,W*.52,q);

  const y=
    lerp(H*.2,H*.43,q);

  const scale=
    lerp(.25,5.5,q);

  plane(
    x,
    y,
    scale,
    -.08,
    1
  );

  /*
    giant flyby wipe
  */

  if(p>.72){

    const wipe=
      smoothstep(.72,1,p);

    ctx.fillStyle=
      `rgba(5,8,9,${wipe*.88})`;

    ctx.fillRect(
      0,0,W,H
    );
  }
}

/* =========================================================
   SCENE 3 — CANAL
========================================================= */

function sceneCanal(t,p){

  drawSky(
    "#c37d52",
    "#e2b777"
  );

  drawSun(
    W*.7,
    H*.3,
    H*.3,
    1
  );

  drawClouds(t);

  drawCanal(t);

  drawBoats(t);

  /* distant formation */

  for(let i=0;i<7;i++){

    const q=i/6;

    const x=
      W*.46+
      (q-.5)*W*.13;

    const y=
      H*.51+
      q*H*.03;

    tank(
      x,
      y,
      .06+q*.035,
      0,
      .65
    );
  }

  drawBirds(t);

  /* forward camera feeling */

  const pulse=
    Math.sin(p*Math.PI)*4;

  camera.x=
    pulse;

  camera.y=
    -p*10;

  camera.zoom=
    1+
    p*.035;
}

/* =========================================================
   SCENE 4 — CROSSING
========================================================= */

function sceneCrossing(t,p){

  drawSky(
    "#5b4034",
    "#1d201c"
  );

  drawSun(
    W*.58,
    H*.33,
    H*.25,
    .35
  );

  drawCanal(t);

  /*
    Low camera
  */

  camera.y=
    20+
    p*35;

  camera.zoom=
    1.04+
    p*.08;

  /*
    crossing vehicles
  */

  for(let i=0;i<9;i++){

    const q=i/8;

    const x=
      W*.25+
      q*W*.5+
      Math.sin(t*.002+i)*15;

    const y=
      H*.62+
      q*H*.22;

    const s=
      .15+
      q*.7;

    tank(
      x,
      y,
      s,
      Math.sin(i)*.025,
      .45+q*.55
    );
  }

  drawDust(
    t,
    1.5
  );

  drawSmoke(
    t,
    1.4
  );

  /* cinematic light bursts */

  const pulse=
    Math.max(
      0,
      Math.sin(
        (p*7)*Math.PI
      )
    );

  if(p>.15){

    ctx.fillStyle=
      `rgba(255,180,80,${pulse*.12})`;

    ctx.fillRect(
      0,0,W,H
    );
  }

  /*
    abstract light trails
    no graphic violence
  */

  for(let i=0;i<5;i++){

    const xx=
      W*.15+
      ((t*90+i*180)%W);

    const yy=
      H*.42+
      Math.sin(i+t*.002)*H*.08;

    lightTrail(
      xx,
      yy,
      .8,
      -.2,
      140,
      .35
    );
  }

  camera.shake=
    p>.35
    ? Math.sin(t*.04)*3
    : 0;
}

/* =========================================================
   SCENE 5 — CLIMAX
========================================================= */

function sceneClimax(t,p){

  drawSky(
    "#e0a66e",
    "#38271f"
  );

  drawSun(
    W*.5,
    H*.3,
    H*.45,
    .7
  );

  drawClouds(t);

  drawSmoke(
    t,
    1.8
  );

  drawDust(
    t,
    2
  );

  /*
    multiple planes
  */

  const planes=[
    [.25,.26,.65,-.05],
    [.42,.20,.42,.03],
    [.61,.28,.55,-.02],
    [.77,.23,.32,.05]
  ];

  planes.forEach((v,i)=>{

    plane(
      W*v[0]+Math.sin(t*.003+i)*35,
      H*v[1]+Math.sin(t*.004+i)*18,
      v[2],
      v[3],
      .9
    );

  });

  /*
    ground movement
  */

  for(let i=0;i<7;i++){

    const q=i/6;

    tank(
      W*.12+q*W*.78,
      H*.73+q*H*.12,
      .25+q*.6,
      -.02,
      .55+q*.45
    );
  }

  /*
    bright cinematic trails
  */

  for(let i=0;i<10;i++){

    const x=
      W*.15+
      ((t*130+i*130)%(
        W*.8
      ));

    const y=
      H*.35+
      Math.sin(
        t*.003+i
      )*H*.18;

    lightTrail(
      x,
      y,
      .75,
      -.25,
      180,
      .28
    );
  }

  /*
    camera impact
  */

  camera.shake=
    2+
    Math.sin(t*.06)*4;

  camera.zoom=
    1.06+
    Math.sin(p*Math.PI)*.06;
}

/* =========================================================
   SCENE 6 — FLAG
========================================================= */

function sceneFlag(t,p){

  drawSky(
    "#24343b",
    "#101617"
  );

  drawSun(
    W*.5,
    H*.4,
    H*.35,
    .28
  );

  drawSmoke(
    t,
    .5
  );

  const reveal=
    smoothstep(0,.35,p);

  ctx.save();

  ctx.globalAlpha=reveal;

  drawFlag(t);

  ctx.restore();

  /*
    falling light
  */

  for(let i=0;i<25;i++){

    const x=
      (i*83+t*.08)%W;

    const y=
      ((i*47+t*.18)%(
        H*.7
      ));

    ctx.fillStyle=
      `rgba(255,215,130,${.08+.06*Math.sin(i)})`;

    ctx.fillRect(
      x,
      y,
      1,
      1
    );
  }
}

/* =========================================================
   RENDER
========================================================= */

function render(t){

  ctx.clearRect(
    0,
    0,
    W,
    H
  );

  const index=
    currentScene(t);

  const scene=
    scenes[index];

  const p=
    clamp(
      (t-scene.start)/
      (scene.end-scene.start),
      0,
      1
    );

  triggerSceneSound(index);

  /*
    captions
  */

  if(
    index===1 ||
    index===2 ||
    index===3 ||
    index===4
  ){

    caption.style.opacity=
      p>.08 && p<.9
      ? "1"
      : "0";

    captionSmall.textContent=
      scene.small;

    captionBig.textContent=
      scene.big;

  }else{

    caption.style.opacity="0";

  }

  camera.shake=0;
  camera.x=0;
  camera.y=0;
  camera.zoom=1;

  beginCamera();

  if(index===0){

    drawSky(
      "#020406",
      "#020406"
    );

  }

  if(index===1){
    sceneNight(t,p);
  }

  if(index===2){
    sceneFlyby(t,p);
  }

  if(index===3){
    sceneCanal(t,p);
  }

  if(index===4){
    sceneCrossing(t,p);
  }

  if(index===5){
    sceneClimax(t,p);
  }

  if(index===6){
    sceneFlag(t,p);
  }

  endCamera();

  /*
    scene transitions
  */

  const fadeIn=
    smoothstep(0,.8,
      Math.min(
        p*1.5,
        1
      )
    );

  if(index!==0){

    ctx.fillStyle=
      `rgba(0,0,0,${1-fadeIn})`;

    ctx.fillRect(
      0,0,W,H
    );
  }

  /*
    final darkening
  */

  if(t>TOTAL-4){

    const f=
      smoothstep(
        TOTAL-4,
        TOTAL,
        t
      );

    ctx.fillStyle=
      `rgba(0,0,0,${f})`;

    ctx.fillRect(
      0,0,W,H
    );
  }

  /*
    progress
  */

  progressBar.style.width=
    `${clamp(t/TOTAL,0,1)*100}%`;

}

/* =========================================================
   LOOP
========================================================= */

function loop(now){

  if(!started) return;

  const t=
    (now-startTime)/1000;

  render(t);

  if(t>=TOTAL){

    started=false;

    endScreen.style.opacity="1";

    return;
  }

  requestAnimationFrame(loop);
}

/* =========================================================
   START
========================================================= */

startBtn.addEventListener("click",async()=>{

  createAudio();

  if(audio){

    try{
      await audio.ac.resume();
    }catch(e){}

  }

  started=true;

  startTime=
    performance.now();

  lastTime=startTime;

  intro.style.opacity="0";

  setTimeout(()=>{
    intro.style.display="none";
  },1500);

  requestAnimationFrame(loop);
});

/* =========================================================
   TOUCH / CLICK — subtle interaction
========================================================= */

document.addEventListener("pointerdown",()=>{

  if(audio && audio.ac.state==="suspended"){

    audio.ac.resume();

  }

});

/* initial frame */

drawSky(
  "#020406",
  "#020406"
);

</script>
