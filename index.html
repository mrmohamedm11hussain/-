<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<meta name="theme-color" content="#02050a">
<title>نصر ٦ أكتوبر | فيلم تفاعلي</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#02050a;
  font-family:Tahoma,Arial,sans-serif;
}

body{
  color:#fff;
  user-select:none;
}

#film{
  position:fixed;
  inset:0;
  background:#02050a;
  overflow:hidden;
}

canvas{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
}

#world{
  z-index:1;
}

#fx{
  z-index:2;
  pointer-events:none;
}

.vignette{
  position:absolute;
  inset:0;
  z-index:5;
  pointer-events:none;
  background:
    radial-gradient(
      ellipse at center,
      transparent 35%,
      rgba(0,0,0,.12) 58%,
      rgba(0,0,0,.78) 100%
    );
}

.grain{
  position:absolute;
  inset:-50%;
  z-index:6;
  pointer-events:none;
  opacity:.11;
  background-image:
    repeating-radial-gradient(
      circle at 0 0,
      rgba(255,255,255,.7) 0 1px,
      transparent 1px 4px
    );
  animation:grain .15s steps(2) infinite;
}

@keyframes grain{
  0%{transform:translate(0,0)}
  25%{transform:translate(2%,-1%)}
  50%{transform:translate(-1%,2%)}
  75%{transform:translate(1%,1%)}
  100%{transform:translate(-2%,-1%)}
}

.letterbox{
  position:absolute;
  left:0;
  width:100%;
  height:9vh;
  background:#000;
  z-index:10;
}

.letterbox.top{top:0}
.letterbox.bottom{bottom:0}

#intro{
  position:absolute;
  inset:0;
  z-index:20;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  background:
    radial-gradient(circle at center,rgba(35,50,65,.35),#010204 70%);
  transition:opacity 1.5s ease;
}

.intro-inner{
  transform:translateY(10px);
  animation:introIn 2.2s ease forwards;
}

@keyframes introIn{
  from{
    opacity:0;
    transform:translateY(25px) scale(.96);
  }
  to{
    opacity:1;
    transform:translateY(0) scale(1);
  }
}

.small{
  color:#b6b9b3;
  letter-spacing:7px;
  font-size:clamp(11px,2vw,18px);
  margin-bottom:20px;
}

.intro-title{
  font-size:clamp(55px,13vw,150px);
  line-height:.85;
  font-weight:900;
  background:linear-gradient(
    180deg,
    #fff,
    #ddd5b2 45%,
    #a99052
  );
  -webkit-background-clip:text;
  color:transparent;
  text-shadow:0 0 50px rgba(255,205,100,.12);
}

.intro-sub{
  margin-top:28px;
  font-size:clamp(15px,3vw,27px);
  color:#ddd;
  letter-spacing:3px;
}

#start{
  margin-top:45px;
  padding:15px 42px;
  border:1px solid rgba(255,255,255,.3);
  border-radius:100px;
  background:rgba(255,255,255,.05);
  color:white;
  font-size:17px;
  cursor:pointer;
  backdrop-filter:blur(10px);
  transition:.3s;
}

#start:hover{
  background:rgba(255,255,255,.12);
  transform:scale(1.04);
}

#hud{
  position:absolute;
  inset:0;
  z-index:12;
  pointer-events:none;
}

.scene-title{
  position:absolute;
  left:50%;
  top:19%;
  transform:translateX(-50%);
  width:90%;
  text-align:center;
  opacity:0;
  transition:opacity 1s,transform 1s;
}

.scene-title.show{
  opacity:1;
  transform:translateX(-50%) translateY(0);
}

.scene-kicker{
  font-size:clamp(11px,1.8vw,16px);
  letter-spacing:5px;
  color:#d2bd7a;
  margin-bottom:13px;
}

.scene-main{
  font-size:clamp(30px,6vw,75px);
  font-weight:900;
  text-shadow:0 4px 30px #000;
}

.scene-description{
  margin-top:15px;
  color:#d8d8d8;
  font-size:clamp(13px,2.2vw,20px);
}

#date{
  position:absolute;
  right:5%;
  bottom:13%;
  font-size:12px;
  color:rgba(255,255,255,.6);
  letter-spacing:3px;
}

#progress{
  position:absolute;
  left:50%;
  bottom:11%;
  transform:translateX(-50%);
  width:min(500px,70%);
  height:2px;
  background:rgba(255,255,255,.18);
}

#progress i{
  display:block;
  width:0%;
  height:100%;
  background:#d6b765;
  box-shadow:0 0 12px #d6b765;
}

#controls{
  position:absolute;
  left:5%;
  bottom:12%;
  z-index:30;
  display:flex;
  gap:8px;
  opacity:0;
  transition:opacity .7s;
}

.control{
  width:40px;
  height:40px;
  border-radius:50%;
  border:1px solid rgba(255,255,255,.2);
  background:rgba(0,0,0,.35);
  color:white;
  cursor:pointer;
  backdrop-filter:blur(8px);
}

#flash{
  position:absolute;
  inset:0;
  z-index:25;
  background:white;
  opacity:0;
  pointer-events:none;
}

#finale{
  position:absolute;
  inset:0;
  z-index:22;
  display:flex;
  justify-content:center;
  align-items:center;
  text-align:center;
  opacity:0;
  pointer-events:none;
  background:
    radial-gradient(circle at center,
      rgba(200,170,90,.16),
      rgba(0,0,0,.92) 70%);
  transition:opacity 2s;
}

.final-content{
  transform:scale(.9);
  transition:transform 2s;
}

#finale.show{
  opacity:1;
}

#finale.show .final-content{
  transform:scale(1);
}

.final-arabic{
  font-size:clamp(45px,11vw,130px);
  font-weight:900;
  line-height:.95;
  background:linear-gradient(
    180deg,
    #fff,
    #e0c36b
  );
  -webkit-background-clip:text;
  color:transparent;
}

.final-line{
  width:80px;
  height:2px;
  background:#d8bb69;
  margin:30px auto;
}

.final-date{
  font-size:clamp(14px,2.5vw,23px);
  letter-spacing:5px;
  color:#ddd;
}

.final-credit{
  margin-top:45px;
  color:#999;
  font-size:12px;
}

@media(max-width:600px){
  .letterbox{
    height:6vh;
  }

  #progress{
    bottom:9%;
  }

  #date{
    bottom:15%;
  }
}

@media(prefers-reduced-motion:reduce){
  .grain{
    animation:none;
  }
}
</style>
</head>

<body>

<div id="film">

<canvas id="world"></canvas>
<canvas id="fx"></canvas>

<div class="vignette"></div>
<div class="grain"></div>

<div class="letterbox top"></div>
<div class="letterbox bottom"></div>

<div id="intro">
  <div class="intro-inner">

    <div class="small">EGYPT • 1973</div>

    <div class="intro-title">
      ٦ أكتوبر
    </div>

    <div class="intro-sub">
      يومٌ عبرت فيه الإرادة
    </div>

    <button id="start">
      ▶ ابدأ الفيلم
    </button>

  </div>
</div>

<div id="hud">

  <div class="scene-title" id="sceneTitle">

    <div class="scene-kicker" id="sceneKicker">
      السادس من أكتوبر
    </div>

    <div class="scene-main" id="sceneMain">
      يومٌ من التاريخ
    </div>

    <div class="scene-description" id="sceneDescription">
      ذكرى نعتز بها
    </div>

  </div>

  <div id="date">
    06 • 10 • 1973
  </div>

  <div id="progress">
    <i></i>
  </div>

</div>

<div id="controls">
  <button class="control" id="mute">🔊</button>
  <button class="control" id="replay">↻</button>
</div>

<div id="flash"></div>

<div id="finale">

  <div class="final-content">

    <div class="final-arabic">
      نصر أكتوبر
    </div>

    <div class="final-line"></div>

    <div class="final-date">
      السادس من أكتوبر ١٩٧٣
    </div>

    <div class="final-credit">
      ذكرى وطنية خالدة
    </div>

  </div>

</div>

</div>

<script>
/* =========================================================
   OCTOBER 6 — CINEMATIC EXPERIENCE
   Self contained / GitHub Pages ready
========================================================= */

const world = document.getElementById("world");
const fx = document.getElementById("fx");

const ctx = world.getContext("2d");
const fctx = fx.getContext("2d");

let W = 0;
let H = 0;
let DPR = Math.min(devicePixelRatio || 1,2);

let playing = false;
let muted = false;

let startedAt = 0;
let elapsed = 0;

const TOTAL = 58;

let audio = null;

const particles = [];
const smoke = [];
const rockets = [];
const planes = [];
const tanks = [];


/* =========================================================
   RESIZE
========================================================= */

function resize(){

  W = innerWidth;
  H = innerHeight;

  world.width = W * DPR;
  world.height = H * DPR;

  fx.width = W * DPR;
  fx.height = H * DPR;

  world.style.width = W+"px";
  world.style.height = H+"px";

  fx.style.width = W+"px";
  fx.style.height = H+"px";

  ctx.setTransform(DPR,0,0,DPR,0,0);
  fctx.setTransform(DPR,0,0,DPR,0,0);
}

addEventListener("resize",resize);
resize();


/* =========================================================
   HELPERS
========================================================= */

function clamp(v,a,b){
  return Math.max(a,Math.min(b,v));
}

function lerp(a,b,t){
  return a+(b-a)*t;
}

function ease(t){
  return t*t*(3-2*t);
}

function rand(a,b){
  return a+Math.random()*(b-a);
}

function rgba(r,g,b,a){
  return `rgba(${r},${g},${b},${a})`;
}


/* =========================================================
   PARTICLES
========================================================= */

function makeParticles(){

  particles.length = 0;

  for(let i=0;i<260;i++){

    particles.push({
      x:Math.random()*W,
      y:Math.random()*H,
      s:Math.random()*2+.2,
      a:Math.random()*.7,
      v:Math.random()*.15+.03,
      drift:rand(-.15,.15)
    });
  }
}

makeParticles();


/* =========================================================
   AUDIO
========================================================= */

function initAudio(){

  if(audio) return;

  try{

    const AC =
      window.AudioContext ||
      window.webkitAudioContext;

    if(!AC) return;

    audio = new AC();

  }catch(e){}
}

function tone(freq,duration,volume,type="sine"){

  if(!audio || muted) return;

  const osc = audio.createOscillator();
  const gain = audio.createGain();

  osc.type = type;
  osc.frequency.value = freq;

  gain.gain.setValueAtTime(0,audio.currentTime);

  gain.gain.linearRampToValueAtTime(
    volume,
    audio.currentTime+.03
  );

  gain.gain.exponentialRampToValueAtTime(
    .001,
    audio.currentTime+duration
  );

  osc.connect(gain);
  gain.connect(audio.destination);

  osc.start();
  osc.stop(audio.currentTime+duration);
}

function cinematicHit(){

  if(muted) return;

  tone(65,.9,.16,"sine");

  setTimeout(()=>{
    tone(110,.35,.08,"triangle");
  },90);
}


/* =========================================================
   SKY
========================================================= */

function drawSky(t){

  let sky;

  if(t<12){

    sky=ctx.createLinearGradient(0,0,0,H);

    sky.addColorStop(0,"#01030a");
    sky.addColorStop(.55,"#07101b");
    sky.addColorStop(1,"#101720");

  }else if(t<30){

    const p=ease(clamp((t-12)/18,0,1));

    sky=ctx.createLinearGradient(0,0,0,H);

    sky.addColorStop(0,
      `rgb(${Math.floor(5+25*p)},
          ${Math.floor(10+28*p)},
          ${Math.floor(18+30*p)})`
    );

    sky.addColorStop(.6,
      `rgb(${Math.floor(18+70*p)},
          ${Math.floor(25+42*p)},
          ${Math.floor(30+18*p)})`
    );

    sky.addColorStop(1,
      `rgb(${Math.floor(28+45*p)},
          ${Math.floor(30+32*p)},
          ${Math.floor(30+12*p)})`
    );

  }else{

    sky=ctx.createLinearGradient(0,0,0,H);

    sky.addColorStop(0,"#273e4b");
    sky.addColorStop(.5,"#91795d");
    sky.addColorStop(1,"#c49c63");

  }

  ctx.fillStyle=sky;
  ctx.fillRect(0,0,W,H);
}


/* =========================================================
   MOON
========================================================= */

function drawMoon(t){

  if(t>20) return;

  const x=W*.78;
  const y=H*.22;
  const r=Math.min(W,H)*.045;

  const glow=ctx.createRadialGradient(
    x,y,0,
    x,y,r*4
  );

  glow.addColorStop(0,"rgba(255,245,205,.28)");
  glow.addColorStop(1,"rgba(255,245,205,0)");

  ctx.fillStyle=glow;
  ctx.beginPath();
  ctx.arc(x,y,r*4,0,Math.PI*2);
  ctx.fill();

  ctx.fillStyle="#f4edcf";
  ctx.beginPath();
  ctx.arc(x,y,r,0,Math.PI*2);
  ctx.fill();
}


/* =========================================================
   STARS
========================================================= */

function drawStars(t){

  if(t>24) return;

  const fade =
    t<18 ? 1 :
    1-clamp((t-18)/6,0,1);

  for(const p of particles){

    if(p.y>H*.62) continue;

    ctx.fillStyle=
      `rgba(255,255,255,${p.a*fade})`;

    ctx.fillRect(
      p.x,
      p.y,
      p.s,
      p.s
    );
  }
}


/* =========================================================
   HORIZON
========================================================= */

function drawHorizon(t){

  const horizon=H*.57;

  ctx.fillStyle="#0b1114";

  ctx.beginPath();
  ctx.moveTo(0,H);

  ctx.lineTo(0,horizon+rand(-2,2));

  for(let x=0;x<=W;x+=40){

    const y =
      horizon
      - Math.sin(x*.008)*8
      - Math.sin(x*.025)*4;

    ctx.lineTo(x,y);
  }

  ctx.lineTo(W,H);
  ctx.closePath();
  ctx.fill();
}


/* =========================================================
   CANAL
========================================================= */

function drawCanal(t){

  if(t<17 || t>42) return;

  const horizon=H*.59;

  const waterTop=W*.18;
  const waterBottom=W*.95;

  const g=ctx.createLinearGradient(
    0,horizon,
    0,H
  );

  g.addColorStop(0,"#354d53");
  g.addColorStop(.45,"#172f38");
  g.addColorStop(1,"#07151c");

  ctx.fillStyle=g;

  ctx.beginPath();

  ctx.moveTo(W/2-waterTop/2,horizon);
  ctx.lineTo(W/2+waterTop/2,horizon);
  ctx.lineTo(W/2+waterBottom/2,H);
  ctx.lineTo(W/2-waterBottom/2,H);

  ctx.closePath();
  ctx.fill();

  /* reflections */

  for(let i=0;i<35;i++){

    const yy=
      horizon+
      Math.pow(i/35,1.8)*(H-horizon);

    const spread=
      lerp(waterTop,waterBottom,i/35)*.42;

    const xx=W/2+Math.sin(i*2.7+t)*20;

    ctx.strokeStyle=
      `rgba(210,190,140,${.035+i/900})`;

    ctx.lineWidth=1;

    ctx.beginPath();

    ctx.moveTo(xx-spread,yy);
    ctx.lineTo(xx+spread,yy);

    ctx.stroke();
  }
}


/* =========================================================
   DESERT
========================================================= */

function drawDesert(t){

  const horizon=H*.57;

  const g=ctx.createLinearGradient(
    0,horizon,0,H
  );

  g.addColorStop(0,"#5e4c38");
  g.addColorStop(.45,"#493c2e");
  g.addColorStop(1,"#171513");

  ctx.fillStyle=g;

  ctx.fillRect(0,horizon,W,H-horizon);

  for(let i=0;i<12;i++){

    const y=
      horizon+
      i*i*2.8;

    ctx.strokeStyle=
      `rgba(220,185,125,${.025})`;

    ctx.beginPath();

    ctx.moveTo(0,y);
    ctx.quadraticCurveTo(
      W*.5,
      y-rand(10,35),
      W,
      y+rand(-8,8)
    );

    ctx.stroke();
  }
}


/* =========================================================
   PLANE
========================================================= */

function drawPlane(x,y,s,rot=0,alpha=1){

  ctx.save();

  ctx.translate(x,y);
  ctx.rotate(rot);
  ctx.scale(s,s);

  ctx.globalAlpha=alpha;

  /* glow */

  const glow=ctx.createRadialGradient(
    -45,8,0,
    -45,8,60
  );

  glow.addColorStop(
    0,
    "rgba(255,170,70,.35)"
  );

  glow.addColorStop(
    1,
    "rgba(255,100,30,0)"
  );

  ctx.fillStyle=glow;
  ctx.beginPath();
  ctx.arc(-45,8,60,0,Math.PI*2);
  ctx.fill();

  /* body */

  const metal=ctx.createLinearGradient(
    0,-12,
    0,15
  );

  metal.addColorStop(0,"#d2d5d1");
  metal.addColorStop(.45,"#59636a");
  metal.addColorStop(1,"#161c20");

  ctx.fillStyle=metal;

  ctx.beginPath();

  ctx.moveTo(-72,3);
  ctx.lineTo(-20,-7);
  ctx.lineTo(52,-3);
  ctx.lineTo(72,0);
  ctx.lineTo(52,4);
  ctx.lineTo(-18,7);
  ctx.closePath();

  ctx.fill();

  /* wings */

  ctx.fillStyle="#303a40";

  ctx.beginPath();

  ctx.moveTo(-8,0);
  ctx.lineTo(-42,-31);
  ctx.lineTo(-8,-17);
  ctx.lineTo(23,0);
  ctx.closePath();

  ctx.fill();

  ctx.beginPath();

  ctx.moveTo(-8,2);
  ctx.lineTo(-38,26);
  ctx.lineTo(-6,15);
  ctx.lineTo(23,2);
  ctx.closePath();

  ctx.fill();

  /* tail */

  ctx.fillStyle="#20282d";

  ctx.beginPath();
  ctx.moveTo(-48,0);
  ctx.lineTo(-62,-22);
  ctx.lineTo(-45,-10);
  ctx.closePath();
  ctx.fill();

  /* cockpit */

  ctx.fillStyle="#07141d";

  ctx.beginPath();
  ctx.ellipse(
    27,-3,
    13,5,
    -.1,
    0,
    Math.PI*2
  );

  ctx.fill();

  /* engine */

  ctx.fillStyle="#ffbc58";

  ctx.beginPath();
  ctx.arc(-66,3,3,0,Math.PI*2);
  ctx.fill();

  ctx.restore();
}


/* =========================================================
   PLANE FORMATION
========================================================= */

function drawPlanes(t){

  if(t<4 || t>34) return;

  const local=t-4;

  const speed=W/13;

  for(let i=0;i<3;i++){

    const x=
      -180+
      local*speed+
      i*220;

    const y=
      H*.25+
      i*H*.07+
      Math.sin(t*.7+i)*18;

    const sc=
      .7+i*.1;

    drawPlane(
      x,
      y,
      sc,
      -.04,
      clamp((x+150)/180,0,1)
    );

    /* contrail */

    if(x>-100 && x<W+100){

      ctx.strokeStyle=
        "rgba(220,230,225,.15)";

      ctx.lineWidth=2;

      ctx.beginPath();

      ctx.moveTo(x-80*sc,y+4);
      ctx.lineTo(x-230*sc,y+18);

      ctx.stroke();
    }
  }
}


/* =========================================================
   TANK
========================================================= */

function drawTank(x,y,s,alpha=1){

  ctx.save();

  ctx.translate(x,y);
  ctx.scale(s,s);

  ctx.globalAlpha=alpha;

  /* shadow */

  ctx.fillStyle="rgba(0,0,0,.45)";

  ctx.beginPath();
  ctx.ellipse(0,32,80,15,0,0,Math.PI*2);
  ctx.fill();

  /* tracks */

  ctx.fillStyle="#171a19";

  roundRect(-75,5,150,35,9);

  ctx.fill();

  /* wheels */

  for(let i=-55;i<=55;i+=27){

    ctx.fillStyle="#343735";

    ctx.beginPath();
    ctx.arc(i,22,11,0,Math.PI*2);
    ctx.fill();

    ctx.fillStyle="#121514";

    ctx.beginPath();
    ctx.arc(i,22,5,0,Math.PI*2);
    ctx.fill();
  }

  /* body */

  ctx.fillStyle="#42483e";

  ctx.beginPath();

  ctx.moveTo(-60,-7);
  ctx.lineTo(-42,-29);
  ctx.lineTo(35,-29);
  ctx.lineTo(61,-7);
  ctx.lineTo(54,12);
  ctx.lineTo(-58,12);

  ctx.closePath();

  ctx.fill();

  /* turret */

  ctx.fillStyle="#343a34";

  ctx.beginPath();
  ctx.ellipse(
    5,-29,
    35,18,
    0,
    0,
    Math.PI*2
  );

  ctx.fill();

  /* barrel */

  ctx.fillStyle="#252b27";

  roundRect(
    18,-37,
    90,
    9,
    4
  );

  ctx.fill();

  /* highlights */

  ctx.strokeStyle="rgba(210,205,165,.18)";
  ctx.lineWidth=2;

  ctx.beginPath();
  ctx.moveTo(-39,-22);
  ctx.lineTo(27,-22);
  ctx.stroke();

  ctx.restore();
}

function roundRect(x,y,w,h,r){

  ctx.beginPath();

  ctx.moveTo(x+r,y);
  ctx.lineTo(x+w-r,y);
  ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r);
  ctx.quadraticCurveTo(
    x+w,y+h,
    x+w-r,y+h
  );
  ctx.lineTo(x+r,y+h);
  ctx.quadraticCurveTo(
    x,y+h,
    x,y+h-r
  );
  ctx.lineTo(x,y+r);
  ctx.quadraticCurveTo(x,y,x+r,y);

  ctx.closePath();
}


/* =========================================================
   TANK COLUMN
========================================================= */

function drawTanks(t){

  if(t<24 || t>48) return;

  const p=
    clamp((t-24)/10,0,1);

  const baseY=H*.73;

  for(let i=0;i<5;i++){

    const x=
      W*.1+
      i*W*.21+
      Math.sin(t*.4+i)*8;

    const y=
      baseY+
      Math.sin(i)*12;

    drawTank(
      x,
      y,
      .5+i*.035,
      .35+p*.65
    );
  }
}


/* =========================================================
   SMOKE
========================================================= */

function addSmoke(x,y){

  for(let i=0;i<12;i++){

    smoke.push({
      x:x+rand(-10,10),
      y:y+rand(-5,5),
      r:rand(5,15),
      vx:rand(-.4,.4),
      vy:rand(-1.2,-.4),
      life:1
    });
  }
}

function updateSmoke(){

  for(let i=smoke.length-1;i>=0;i--){

    const s=smoke[i];

    s.x+=s.vx;
    s.y+=s.vy;
    s.r+=.35;
    s.life-=.012;

    if(s.life<=0){
      smoke.splice(i,1);
    }
  }
}

function drawSmoke(){

  for(const s of smoke){

    ctx.fillStyle=
      `rgba(45,48,45,${s.life*.12})`;

    ctx.beginPath();

    ctx.arc(
      s.x,
      s.y,
      s.r,
      0,
      Math.PI*2
    );

    ctx.fill();
  }
}


/* =========================================================
   ROCKET / LIGHT TRAILS
========================================================= */

function launchRocket(){

  rockets.push({
    x:rand(W*.15,W*.85),
    y:H*.72,
    tx:rand(W*.25,W*.75),
    ty:rand(H*.22,H*.45),
    p:0
  });
}

function updateRockets(){

  for(let i=rockets.length-1;i>=0;i--){

    const r=rockets[i];

    r.p+=.025;

    if(r.p>=1){

      flash();
      cinematicHit();

      addSmoke(r.tx,r.ty);

      rockets.splice(i,1);

      continue;
    }
  }
}

function drawRockets(){

  for(const r of rockets){

    const x=lerp(r.x,r.tx,ease(r.p));
    const y=lerp(r.y,r.ty,ease(r.p));

    const px=lerp(r.x,r.tx,ease(Math.max(0,r.p-.1)));
    const py=lerp(r.y,r.ty,ease(Math.max(0,r.p-.1)));

    ctx.strokeStyle=
      "rgba(255,190,80,.45)";

    ctx.lineWidth=3;

    ctx.beginPath();

    ctx.moveTo(px,py);
    ctx.lineTo(x,y);

    ctx.stroke();

    ctx.fillStyle="#ffd47b";

    ctx.beginPath();
    ctx.arc(x,y,4,0,Math.PI*2);
    ctx.fill();
  }
}


/* =========================================================
   LIGHT FLASH
========================================================= */

function flash(){

  const el=document.getElementById("flash");

  el.style.transition="none";
  el.style.opacity=".8";

  requestAnimationFrame(()=>{

    el.style.transition=
      "opacity .65s ease";

    el.style.opacity="0";
  });
}


/* =========================================================
   FLAG
========================================================= */

function drawFlag(t){

  if(t<43) return;

  const p=
    clamp((t-43)/8,0,1);

  const alpha=ease(p);

  ctx.save();

  ctx.globalAlpha=alpha;

  const fw=Math.min(W*.48,520);
  const fh=fw*.63;

  const x=W/2-fw/2;
  const y=H*.22;

  ctx.shadowBlur=60;
  ctx.shadowColor="rgba(255,220,130,.25)";

  ctx.fillStyle="#c9272c";
  ctx.fillRect(x,y,fw,fh/3);

  ctx.fillStyle="#f2f2ed";
  ctx.fillRect(x,y+fh/3,fw,fh/3);

  ctx.fillStyle="#17191a";
  ctx.fillRect(x,y+fh*2/3,fw,fh/3);

  /* symbolic golden eagle */

  ctx.fillStyle="#c99b36";

  ctx.beginPath();

  ctx.moveTo(
    x+fw*.5,
    y+fh*.47
  );

  ctx.lineTo(
    x+fw*.44,
    y+fh*.38
  );

  ctx.lineTo(
    x+fw*.39,
    y+fh*.46
  );

  ctx.lineTo(
    x+fw*.44,
    y+fh*.51
  );

  ctx.lineTo(
    x+fw*.5,
    y+fh*.57
  );

  ctx.lineTo(
    x+fw*.56,
    y+fh*.51
  );

  ctx.lineTo(
    x+fw*.61,
    y+fh*.46
  );

  ctx.lineTo(
    x+fw*.56,
    y+fh*.38
  );

  ctx.closePath();

  ctx.fill();

  ctx.restore();
}


/* =========================================================
   PARTICLE DUST
========================================================= */

function drawDust(t){

  if(t<20) return;

  const amount=
    clamp((t-20)/20,0,1);

  for(let i=0;i<70;i++){

    const x=
      (i*137+t*15)%W;

    const y=
      H*.55+
      ((i*71)%Math.floor(H*.45));

    ctx.fillStyle=
      `rgba(220,195,150,${.025*amount})`;

    ctx.fillRect(x,y,2,2);
  }
}


/* =========================================================
   SCENE TEXT
========================================================= */

const scenes=[

  {
    from:0,
    to:8,
    kicker:"السادس من أكتوبر",
    main:"يومٌ من التاريخ",
    desc:"حين اجتمعت الإرادة والعزيمة"
  },

  {
    from:8,
    to:18,
    kicker:"اللحظة",
    main:"حين عبرت الإرادة",
    desc:"سماءٌ تتغير... وأرضٌ تستعد للحظة تاريخية"
  },

  {
    from:18,
    to:30,
    kicker:"قناة السويس",
    main:"عبورٌ إلى التاريخ",
    desc:"ذكرى خالدة في الوجدان المصري"
  },

  {
    from:30,
    to:43,
    kicker:"أكتوبر ١٩٧٣",
    main:"الإرادة لا تعرف المستحيل",
    desc:"لحظات صنعت واحدة من أشهر صفحات التاريخ المصري"
  },

  {
    from:43,
    to:52,
    kicker:"مصر",
    main:"رايةٌ لا تنحني",
    desc:"وطنٌ... وذكرى... وفخر"
  },

  {
    from:52,
    to:58,
    kicker:"النهاية",
    main:"نصر أكتوبر",
    desc:"السادس من أكتوبر ١٩٧٣"
  }

];

let currentScene=-1;

function updateSceneText(t){

  let index=
    scenes.findIndex(
      s=>t>=s.from && t<s.to
    );

  if(index<0) index=scenes.length-1;

  if(index===currentScene) return;

  currentScene=index;

  const s=scenes[index];

  const title=
    document.getElementById("sceneTitle");

  title.classList.remove("show");

  setTimeout(()=>{

    document.getElementById("sceneKicker").textContent=s.kicker;
    document.getElementById("sceneMain").textContent=s.main;
    document.getElementById("sceneDescription").textContent=s.desc;

    title.classList.add("show");

  },100);
}


/* =========================================================
   SCENE EFFECTS
========================================================= */

let lastRocket=0;

function sceneEffects(t){

  if(t>29 && t<42){

    if(t-lastRocket>2.8){

      launchRocket();
      lastRocket=t;
    }
  }

  if(t>18 && t<25){

    if(Math.random()<.008){

      addSmoke(
        W*.5+rand(-W*.3,W*.3),
        H*.62
      );
    }
  }
}


/* =========================================================
   DRAW FRAME
========================================================= */

function render(t){

  ctx.clearRect(0,0,W,H);
  fctx.clearRect(0,0,W,H);

  drawSky(t);
  drawStars(t);
  drawMoon(t);

  drawHorizon(t);

  drawDesert(t);
  drawCanal(t);

  drawPlanes(t);
  drawTanks(t);

  drawDust(t);

  updateSmoke();
  drawSmoke();

  updateRockets();
  drawRockets();

  drawFlag(t);

  /* atmospheric sun */

  if(t>17 && t<42){

    const p=
      clamp((t-17)/10,0,1);

    const x=W*.18;
    const y=H*.32;

    const g=ctx.createRadialGradient(
      x,y,0,
      x,y,W*.3
    );

    g.addColorStop(
      0,
      `rgba(255,192,100,${.18*p})`
    );

    g.addColorStop(
      1,
      "rgba(255,120,50,0)"
    );

    ctx.fillStyle=g;
    ctx.fillRect(0,0,W,H);
  }

  sceneEffects(t);

  updateSceneText(t);

  const progress=
    clamp(t/TOTAL,0,1)*100;

  document.querySelector("#progress i")
    .style.width=progress+"%";
}


/* =========================================================
   CAMERA
========================================================= */

function camera(){

  if(!playing) return;

  const shake=
    elapsed>28 && elapsed<42
      ? Math.sin(elapsed*20)*1.2
      : 0;

  world.style.transform=
    `translate(${shake}px,${shake*.5}px)`;

  fx.style.transform=
    `translate(${shake*.5}px,${shake*.3}px)`;
}


/* =========================================================
   LOOP
========================================================= */

function loop(now){

  if(playing){

    elapsed=
      (performance.now()-startedAt)/1000;

    if(elapsed>=TOTAL){

      elapsed=TOTAL;
      playing=false;

      document
        .getElementById("finale")
        .classList.add("show");

    }

    render(elapsed);
    camera();
  }

  requestAnimationFrame(loop);
}

requestAnimationFrame(loop);


/* =========================================================
   START
========================================================= */

document.getElementById("start")
.addEventListener("click",()=>{

  initAudio();

  if(audio && audio.state==="suspended"){
    audio.resume();
  }

  playing=true;
  startedAt=performance.now();

  document.getElementById("intro").style.opacity="0";

  setTimeout(()=>{

    document.getElementById("intro").style.display="none";

    document.getElementById("controls").style.opacity="1";

  },1500);

  tone(180,.7,.05,"sine");
});


/* =========================================================
   MUTE
========================================================= */

document.getElementById("mute")
.addEventListener("click",()=>{

  muted=!muted;

  document.getElementById("mute").textContent=
    muted ? "🔇" : "🔊";
});


/* =========================================================
   REPLAY
========================================================= */

document.getElementById("replay")
.addEventListener("click",()=>{

  document
    .getElementById("finale")
    .classList.remove("show");

  currentScene=-1;

  smoke.length=0;
  rockets.length=0;

  elapsed=0;

  startedAt=performance.now();

  playing=true;

  if(audio && audio.state==="suspended"){
    audio.resume();
  }

  flash();
});


/* =========================================================
   KEYBOARD
========================================================= */

addEventListener("keydown",e=>{

  if(e.code==="Space"){

    e.preventDefault();

    if(!playing){

      if(elapsed>=TOTAL){

        document
          .getElementById("finale")
          .classList.remove("show");

        elapsed=0;
        startedAt=performance.now();
      }

      playing=true;
    }
  }

  if(e.key==="m"){

    muted=!muted;

    document.getElementById("mute").textContent=
      muted ? "🔇" : "🔊";
  }
});


/* =========================================================
   INITIAL DRAW
========================================================= */

render(0);

</script>
