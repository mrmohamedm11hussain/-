<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">

<title>فيلم العبور | ٦ أكتوبر ١٩٧٣</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    font-family:Tahoma,Arial,sans-serif;
}

#app{
    position:fixed;
    inset:0;
    overflow:hidden;
    background:#000;
}

canvas{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
}

#vignette{
    position:absolute;
    inset:0;
    pointer-events:none;
    z-index:4;
    background:
        radial-gradient(
            ellipse at center,
            transparent 35%,
            rgba(0,0,0,.25) 65%,
            rgba(0,0,0,.9) 130%
        );
}

#grain{
    position:absolute;
    inset:-50%;
    z-index:5;
    pointer-events:none;
    opacity:.045;
    background-image:
        radial-gradient(
            rgba(255,255,255,.7) .6px,
            transparent .8px
        );
    background-size:4px 4px;
    animation:grain .15s steps(2) infinite;
}

@keyframes grain{
    0%{transform:translate(0,0)}
    25%{transform:translate(2%,-1%)}
    50%{transform:translate(-1%,2%)}
    75%{transform:translate(1%,1%)}
    100%{transform:translate(-2%,-1%)}
}

/* ================= INTRO ================= */

#intro{
    position:absolute;
    inset:0;
    z-index:20;
    background:
        radial-gradient(
            circle at 50% 45%,
            #172027 0,
            #050708 48%,
            #000 100%
        );
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    transition:opacity 1.4s ease;
}

.date{
    font-size:clamp(55px,13vw,145px);
    font-weight:900;
    letter-spacing:7px;
    text-shadow:
        0 0 40px rgba(255,210,120,.1),
        0 20px 60px #000;
}

.title{
    margin-top:22px;
    color:#d9bd76;
    font-size:clamp(18px,4vw,34px);
    letter-spacing:6px;
}

.line{
    width:110px;
    height:1px;
    background:#c8a75c;
    margin:35px 0;
}

#start{
    border:1px solid rgba(255,255,255,.4);
    background:rgba(255,255,255,.04);
    color:white;
    padding:16px 45px;
    border-radius:50px;
    font-size:16px;
    cursor:pointer;
    transition:.3s;
    backdrop-filter:blur(10px);
}

#start:hover{
    background:rgba(255,255,255,.13);
    transform:scale(1.04);
}

#start:active{
    transform:scale(.97);
}

.tip{
    margin-top:18px;
    color:rgba(255,255,255,.4);
    font-size:11px;
}

/* ================= HUD ================= */

#hud{
    position:absolute;
    z-index:8;
    top:18px;
    left:20px;
    right:20px;
    display:flex;
    justify-content:space-between;
    color:rgba(255,255,255,.5);
    font-size:10px;
    letter-spacing:3px;
    pointer-events:none;
}

#sound{
    position:absolute;
    z-index:8;
    top:45px;
    left:20px;
    font-size:10px;
    color:rgba(255,255,255,.4);
    opacity:0;
}

/* ================= CAPTION ================= */

#caption{
    position:absolute;
    z-index:10;
    left:50%;
    bottom:9%;
    transform:translateX(-50%);
    width:min(900px,90%);
    text-align:center;
    opacity:0;
    transition:opacity .7s;
    pointer-events:none;
    text-shadow:0 4px 25px #000;
}

#captionDate{
    color:#d7bd78;
    font-size:11px;
    letter-spacing:4px;
    margin-bottom:10px;
}

#captionTitle{
    font-size:clamp(25px,5vw,58px);
    font-weight:900;
}

#captionText{
    margin:13px auto 0;
    max-width:760px;
    color:rgba(255,255,255,.86);
    font-size:clamp(12px,2vw,17px);
    line-height:1.9;
}

/* ================= PROGRESS ================= */

#progress{
    position:absolute;
    z-index:12;
    left:0;
    right:0;
    bottom:0;
    height:3px;
    background:rgba(255,255,255,.1);
}

#progressBar{
    height:100%;
    width:0%;
    background:linear-gradient(
        90deg,
        #8d7135,
        #f1db91,
        #8d7135
    );
    box-shadow:0 0 12px rgba(230,190,90,.7);
}

/* ================= END ================= */

#end{
    position:absolute;
    inset:0;
    z-index:30;
    background:#000;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    opacity:0;
    pointer-events:none;
    transition:opacity 2s;
}

#end h1{
    font-size:clamp(50px,11vw,140px);
    font-weight:900;
}

#end .gold{
    color:#d5bb75;
    font-size:clamp(16px,3vw,28px);
    letter-spacing:5px;
    margin-top:20px;
}

#end hr{
    width:120px;
    border:0;
    height:1px;
    background:#a98b4d;
    margin:32px;
}

#end p{
    color:rgba(255,255,255,.45);
    font-size:12px;
}

@media(max-width:600px){

    #hud{
        top:12px;
        left:12px;
        right:12px;
    }

    #sound{
        left:12px;
        top:38px;
    }
}
</style>
</head>

<body>

<div id="app">

<canvas id="canvas"></canvas>

<div id="vignette"></div>
<div id="grain"></div>

<div id="hud">
    <span>٦ أكتوبر ١٩٧٣</span>
    <span>فيلم العبور</span>
</div>

<div id="sound">● المؤثرات الصوتية تعمل</div>

<div id="caption">

    <div id="captionDate"></div>

    <div id="captionTitle"></div>

    <div id="captionText"></div>

</div>

<div id="progress">
    <div id="progressBar"></div>
</div>

<!-- INTRO -->

<div id="intro">

    <div class="date">06.10.1973</div>

    <div class="title">
        فيلم العبور
    </div>

    <div class="line"></div>

    <button id="start">
        ابدأ الفيلم
    </button>

    <div class="tip">
        شغّل الصوت للحصول على التجربة الكاملة
    </div>

</div>

<!-- END -->

<div id="end">

    <h1>نصر أكتوبر</h1>

    <div class="gold">
        السادس من أكتوبر ١٩٧٣
    </div>

    <hr>

    <p>
        ذكرى العبور والنصر
    </p>

</div>

</div>

<script>

/* =====================================================
   إعداد الفيلم
===================================================== */

const canvas = document.getElementById("canvas");

const ctx = canvas.getContext("2d");

let W = 0;
let H = 0;
let DPR = 1;

function resize(){

    W = window.innerWidth;

    H = window.innerHeight;

    DPR = Math.min(
        window.devicePixelRatio || 1,
        1.5
    );

    canvas.width = W * DPR;

    canvas.height = H * DPR;

    canvas.style.width = W + "px";

    canvas.style.height = H + "px";

    ctx.setTransform(
        DPR,
        0,
        0,
        DPR,
        0,
        0
    );
}

window.addEventListener(
    "resize",
    resize
);

resize();


/* =====================================================
   أدوات
===================================================== */

function clamp(v,min,max){

    return Math.max(
        min,
        Math.min(max,v)
    );
}

function lerp(a,b,t){

    return a + (b-a)*t;
}

function ease(t){

    t = clamp(t,0,1);

    return t*t*(3-2*t);
}

function between(t,a,b){

    return ease(
        (t-a)/(b-a)
    );
}


/* =====================================================
   AUDIO
===================================================== */

let audio = null;

function createAudio(){

    if(audio) return;

    const AudioContext =
        window.AudioContext ||
        window.webkitAudioContext;

    if(!AudioContext) return;

    const ac =
        new AudioContext();

    const master =
        ac.createGain();

    master.gain.value = .20;

    master.connect(
        ac.destination
    );

    audio = {
        ac: ac,
        master: master
    };

    /* صوت خلفية منخفض */

    const osc =
        ac.createOscillator();

    const gain =
        ac.createGain();

    osc.type = "sine";

    osc.frequency.value = 38;

    gain.gain.value = .018;

    osc.connect(gain);

    gain.connect(master);

    osc.start();

    audio.drone = gain;
}


function playTone(
    frequency,
    duration,
    volume,
    type
){

    if(!audio) return;

    const ac =
        audio.ac;

    const osc =
        ac.createOscillator();

    const gain =
        ac.createGain();

    osc.type =
        type || "sine";

    osc.frequency.setValueAtTime(
        frequency,
        ac.currentTime
    );

    gain.gain.setValueAtTime(
        .0001,
        ac.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
        volume || .05,
        ac.currentTime + .04
    );

    gain.gain.exponentialRampToValueAtTime(
        .0001,
        ac.currentTime + duration
    );

    osc.connect(gain);

    gain.connect(
        audio.master
    );

    osc.start();

    osc.stop(
        ac.currentTime +
        duration +
        .05
    );
}


function whoosh(){

    if(!audio) return;

    const ac =
        audio.ac;

    const osc =
        ac.createOscillator();

    const gain =
        ac.createGain();

    osc.type = "sawtooth";

    osc.frequency.setValueAtTime(
        80,
        ac.currentTime
    );

    osc.frequency.exponentialRampToValueAtTime(
        700,
        ac.currentTime + .8
    );

    osc.frequency.exponentialRampToValueAtTime(
        70,
        ac.currentTime + 1.7
    );

    gain.gain.setValueAtTime(
        .0001,
        ac.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
        .09,
        ac.currentTime + .55
    );

    gain.gain.exponentialRampToValueAtTime(
        .0001,
        ac.currentTime + 1.8
    );

    osc.connect(gain);

    gain.connect(
        audio.master
    );

    osc.start();

    osc.stop(
        ac.currentTime + 1.9
    );
}


function boom(){

    playTone(
        45,
        .8,
        .13,
        "sawtooth"
    );

    setTimeout(
        function(){

            playTone(
                70,
                .45,
                .07,
                "triangle"
            );

        },
        100
    );
}


function waterSound(){

    playTone(
        110,
        1.1,
        .025,
        "sine"
    );

    setTimeout(
        function(){

            playTone(
                150,
                .8,
                .018,
                "sine"
            );

        },
        200
    );
}


/* =====================================================
   PARTICLES
===================================================== */

const starParticles = [];

for(let i=0;i<170;i++){

    starParticles.push({

        x:Math.random(),

        y:Math.random()*.7,

        r:.4+Math.random()*1.5,

        a:.2+Math.random()*.7,

        phase:Math.random()*6.28

    });
}


const dustParticles = [];

for(let i=0;i<140;i++){

    dustParticles.push({

        x:Math.random(),

        y:Math.random(),

        size:3+Math.random()*20,

        speed:.2+Math.random()*1.3,

        phase:Math.random()*6.28

    });
}


/* =====================================================
   السماء
===================================================== */

function drawSky(
    top,
    bottom
){

    const gradient =
        ctx.createLinearGradient(
            0,
            0,
            0,
            H
        );

    gradient.addColorStop(
        0,
        top
    );

    gradient.addColorStop(
        1,
        bottom
    );

    ctx.fillStyle =
        gradient;

    ctx.fillRect(
        0,
        0,
        W,
        H
    );
}


/* =====================================================
   النجوم
===================================================== */

function drawStars(t){

    for(
        const s of starParticles
    ){

        const alpha =
            s.a +
            Math.sin(
                t*.004+
                s.phase
            )*.18;

        ctx.fillStyle =
            `rgba(255,255,255,${alpha})`;

        ctx.beginPath();

        ctx.arc(
            s.x*W,
            s.y*H,
            s.r,
            0,
            Math.PI*2
        );

        ctx.fill();
    }
}


/* =====================================================
   الشمس
===================================================== */

function drawSun(
    x,
    y,
    radius,
    alpha
){

    const g =
        ctx.createRadialGradient(
            x,
            y,
            0,
            x,
            y,
            radius
        );

    g.addColorStop(
        0,
        `rgba(255,238,180,${alpha})`
    );

    g.addColorStop(
        .25,
        `rgba(255,180,75,${alpha*.4})`
    );

    g.addColorStop(
        1,
        "rgba(255,120,30,0)"
    );

    ctx.fillStyle = g;

    ctx.beginPath();

    ctx.arc(
        x,
        y,
        radius,
        0,
        Math.PI*2
    );

    ctx.fill();
}


/* =====================================================
   خريطة سينمائية
===================================================== */

function drawMap(t,p){

    ctx.fillStyle =
        "#10191b";

    ctx.fillRect(
        0,
        0,
        W,
        H
    );

    /* مصر */

    ctx.fillStyle =
        "#77694b";

    ctx.beginPath();

    ctx.moveTo(
        W*.08,
        H*.18
    );

    ctx.lineTo(
        W*.46,
        H*.15
    );

    ctx.lineTo(
        W*.51,
        H*.38
    );

    ctx.lineTo(
        W*.43,
        H*.61
    );

    ctx.lineTo(
        W*.22,
        H*.68
    );

    ctx.lineTo(
        W*.07,
        H*.52
    );

    ctx.closePath();

    ctx.fill();


    /* سيناء */

    ctx.fillStyle =
        "#8b7953";

    ctx.beginPath();

    ctx.moveTo(
        W*.51,
        H*.36
    );

    ctx.lineTo(
        W*.92,
        H*.17
    );

    ctx.lineTo(
        W*.97,
        H*.56
    );

    ctx.lineTo(
        W*.52,
        H*.64
    );

    ctx.closePath();

    ctx.fill();


    /* قناة السويس */

    ctx.strokeStyle =
        "#4d7378";

    ctx.lineWidth = 10;

    ctx.beginPath();

    ctx.moveTo(
        W*.51,
        H*.35
    );

    ctx.lineTo(
        W*.51,
        H*.64
    );

    ctx.stroke();


    /* النيل */

    ctx.strokeStyle =
        "#42666c";

    ctx.lineWidth = 14;

    ctx.beginPath();

    ctx.moveTo(
        W*.18,
        H*.16
    );

    ctx.bezierCurveTo(
        W*.28,
        H*.27,
        W*.36,
        H*.39,
        W*.48,
        H*.5
    );

    ctx.stroke();


    /* الكتابة */

    ctx.fillStyle =
        "rgba(255,255,255,.75)";

    ctx.font =
        "bold 15px Tahoma";

    ctx.fillText(
        "مصر",
        W*.27,
        H*.3
    );

    ctx.fillText(
        "سيناء",
        W*.71,
        H*.3
    );

    ctx.fillStyle =
        "#e0c17a";

    ctx.fillText(
        "قناة السويس",
        W*.53,
        H*.5
    );


    /* أسهم العبور */

    const visible =
        ease(
            clamp(p,0,1)
        );

    ctx.strokeStyle =
        `rgba(185,50,45,${visible})`;

    ctx.lineWidth = 4;

    for(let i=0;i<5;i++){

        const y =
            H*.37 +
            i*H*.045;

        ctx.beginPath();

        ctx.moveTo(
            W*.52,
            y
        );

        ctx.lineTo(
            W*.74,
            y+H*.025
        );

        ctx.stroke();

        ctx.beginPath();

        ctx.moveTo(
            W*.74,
            y+H*.025
        );

        ctx.lineTo(
            W*.71,
            y+H*.005
        );

        ctx.moveTo(
            W*.74,
            y+H*.025
        );

        ctx.lineTo(
            W*.71,
            y+H*.045
        );

        ctx.stroke();
    }
}


/* =====================================================
   القناة
===================================================== */

function drawCanal(t){

    const horizon =
        H*.45;

    drawSky(
        "#a96847",
        "#d6ad72"
    );

    drawSun(
        W*.72,
        H*.28,
        H*.33,
        .7
    );


    /* الصحراء */

    ctx.fillStyle =
        "#786a4c";

    ctx.fillRect(
        0,
        horizon,
        W,
        H-horizon
    );


    /* الماء */

    ctx.beginPath();

    ctx.moveTo(
        W*.47,
        horizon
    );

    ctx.lineTo(
        W*.53,
        horizon
    );

    ctx.lineTo(
        W*.94,
        H
    );

    ctx.lineTo(
        W*.06,
        H
    );

    ctx.closePath();

    const water =
        ctx.createLinearGradient(
            0,
            horizon,
            0,
            H
        );

    water.addColorStop(
        0,
        "#3d6268"
    );

    water.addColorStop(
        .5,
        "#23474f"
    );

    water.addColorStop(
        1,
        "#071a20"
    );

    ctx.fillStyle =
        water;

    ctx.fill();


    /* انعكاسات الماء */

    for(let i=0;i<100;i++){

        const p =
            i/100;

        const y =
            horizon +
            Math.pow(p,1.6)*
            (H-horizon);

        const width =
            lerp(
                8,
                220,
                p
            );

        const drift =
            Math.sin(
                t*.003+i
            )*12;

        ctx.strokeStyle =
            i%3===0
            ? "rgba(220,205,160,.17)"
            : "rgba(150,180,175,.11)";

        ctx.lineWidth = 1;

        ctx.beginPath();

        ctx.moveTo(
            W/2-width+drift,
            y
        );

        ctx.lineTo(
            W/2+width+drift,
            y
        );

        ctx.stroke();
    }


    /* الشواطئ */

    ctx.strokeStyle =
        "rgba(230,195,125,.45)";

    ctx.lineWidth = 2;

    ctx.beginPath();

    ctx.moveTo(
        W*.47,
        horizon
    );

    ctx.lineTo(
        W*.06,
        H
    );

    ctx.moveTo(
        W*.53,
        horizon
    );

    ctx.lineTo(
        W*.94,
        H
    );

    ctx.stroke();
}


/* =====================================================
   القوارب
===================================================== */

function drawBoat(
    x,
    y,
    scale,
    direction
){

    ctx.save();

    ctx.translate(
        x,
        y
    );

    ctx.scale(
        scale*direction,
        scale
    );

    ctx.fillStyle =
        "#101515";

    ctx.beginPath();

    ctx.moveTo(
        -55,
        0
    );

    ctx.lineTo(
        42,
        0
    );

    ctx.lineTo(
        55,
        -10
    );

    ctx.lineTo(
        35,
        11
    );

    ctx.lineTo(
        -45,
        11
    );

    ctx.closePath();

    ctx.fill();


    ctx.fillRect(
        -18,
        -23,
        37,
        23
    );


    ctx.fillRect(
        -7,
        -38,
        14,
        16
    );


    ctx.strokeStyle =
        "#111";

    ctx.lineWidth = 3;

    ctx.beginPath();

    ctx.moveTo(
        0,
        -37
    );

    ctx.lineTo(
        0,
        -64
    );

    ctx.stroke();

    ctx.restore();
}


/* =====================================================
   تحصينات
===================================================== */

function drawFortification(){

    const y =
        H*.57;

    ctx.fillStyle =
        "#594a35";

    ctx.fillRect(
        0,
        y,
        W,
        H*.2
    );


    ctx.beginPath();

    ctx.moveTo(
        0,
        y
    );

    for(
        let x=0;
        x<=W;
        x+=40
    ){

        ctx.lineTo(
            x,
            y-25-
            Math.sin(x*.025)*9
        );
    }

    ctx.lineTo(
        W,
        y+70
    );

    ctx.lineTo(
        0,
        y+70
    );

    ctx.closePath();

    ctx.fill();


    for(
        let x=50;
        x<W;
        x+=110
    ){

        ctx.strokeStyle =
            "#29291f";

        ctx.lineWidth = 4;

        ctx.beginPath();

        ctx.moveTo(
            x,
            y-58
        );

        ctx.lineTo(
            x,
            y-8
        );

        ctx.stroke();
    }
}


/* =====================================================
   دخان
===================================================== */

function drawSmoke(t,intensity){

    for(let i=0;i<40;i++){

        const p =
            i/40;

        const x =
            W*.48 +
            Math.sin(
                i*2.4+t*.001
            )*85+
            p*120;

        const y =
            H*.6-
            p*H*.35+
            Math.sin(
                t*.001+i
            )*10;

        const r =
            12+p*70;

        const g =
            ctx.createRadialGradient(
                x,
                y,
                0,
                x,
                y,
                r
            );

        g.addColorStop(
            0,
            `rgba(55,57,52,${.14*intensity*(1-p)})`
        );

        g.addColorStop(
            1,
            "rgba(20,20,18,0)"
        );

        ctx.fillStyle = g;

        ctx.beginPath();

        ctx.arc(
            x,
            y,
            r,
            0,
            Math.PI*2
        );

        ctx.fill();
    }
}


/* =====================================================
   غبار
===================================================== */

function drawDust(t,intensity){

    for(
        const d of dustParticles
    ){

        const x =
            ((d.x*W+
            t*d.speed*35)
            %(W+250))-125;

        const y =
            H*.64+
            Math.sin(
                t*.002+d.phase
            )*H*.12+
            d.y*H*.15;

        ctx.fillStyle =
            `rgba(190,163,112,${.025*intensity})`;

        ctx.beginPath();

        ctx.arc(
            x,
            y,
            d.size*intensity,
            0,
            Math.PI*2
        );

        ctx.fill();
    }
}


/* =====================================================
   الضوء
===================================================== */

function flash(alpha){

    if(alpha<=0)return;

    ctx.fillStyle =
        `rgba(255,220,160,${alpha})`;

    ctx.fillRect(
        0,
        0,
        W,
        H
    );
}


/* =====================================================
   الطائرة السينمائية
===================================================== */

function plane(
    x,
    y,
    scale,
    angle
){

    ctx.save();

    ctx.translate(
        x,
        y
    );

    ctx.rotate(
        angle
    );

    ctx.scale(
        scale,
        scale
    );

    ctx.fillStyle =
        "#151c1e";

    /* الجسم */

    ctx.beginPath();

    ctx.moveTo(
        80,
        0
    );

    ctx.lineTo(
        10,
        -7
    );

    ctx.lineTo(
        -60,
        -5
    );

    ctx.lineTo(
        -82,
        0
    );

    ctx.lineTo(
        -60,
        5
    );

    ctx.lineTo(
        10,
        7
    );

    ctx.closePath();

    ctx.fill();


    /* الجناح */

    ctx.beginPath();

    ctx.moveTo(
        25,
        -3
    );

    ctx.lineTo(
        -20,
        -55
    );

    ctx.lineTo(
        -5,
        -58
    );

    ctx.lineTo(
        45,
        -4
    );

    ctx.fill();


    ctx.beginPath();

    ctx.moveTo(
        25,
        3
    );

    ctx.lineTo(
        -20,
        55
    );

    ctx.lineTo(
        -5,
        58
    );

    ctx.lineTo(
        45,
        4
    );

    ctx.fill();


    /* المحرك */

    ctx.shadowColor =
        "rgba(255,140,60,.8)";

    ctx.shadowBlur = 18;

    ctx.fillStyle =
        "rgba(255,145,60,.75)";

    ctx.beginPath();

    ctx.ellipse(
        -78,
        0,
        10,
        3,
        0,
        0,
        Math.PI*2
    );

    ctx.fill();

    ctx.restore();
}


/* =====================================================
   العلم
===================================================== */

function drawFlag(t,alpha){

    ctx.save();

    ctx.globalAlpha =
        alpha;

    const width =
        Math.min(
            W*.43,
            400
        );

    const height =
        width*.66;

    const x =
        W/2-width/2;

    const y =
        H*.28;


    /* العمود */

    ctx.strokeStyle =
        "#c8b990";

    ctx.lineWidth = 4;

    ctx.beginPath();

    ctx.moveTo(
        x-12,
        y-45
    );

    ctx.lineTo(
        x-12,
        y+height+70
    );

    ctx.stroke();


    const rows=45;

    for(
        let i=0;
        i<rows;
        i++
    ){

        let color;

        if(
            i<rows/3
        ){

            color="#b62e34";

        }else if(
            i<rows*2/3
        ){

            color="#eeeae0";

        }else{

            color="#111";
        }

        const yy =
            i/rows*height;

        ctx.fillStyle =
            color;

        ctx.beginPath();

        for(
            let j=0;
            j<=70;
            j++
        ){

            const xx =
                j/70*width;

            const wave =
                Math.sin(
                    t*.006+
                    j*.25+
                    i*.08
                )*8;

            if(j===0){

                ctx.moveTo(
                    x+xx,
                    y+yy+wave
                );

            }else{

                ctx.lineTo(
                    x+xx,
                    y+yy+wave
                );
            }
        }

        for(
            let j=70;
            j>=0;
            j--
        ){

            const xx =
                j/70*width;

            const wave =
                Math.sin(
                    t*.006+
                    j*.25+
                    (i+1)*.08
                )*8;

            ctx.lineTo(
                x+xx,
                y+yy+
                height/rows+
                wave
            );
        }

        ctx.closePath();

        ctx.fill();
    }


    /* النسر بشكل رمزي */

    ctx.fillStyle =
        "#d4b85e";

    ctx.beginPath();

    ctx.arc(
        W/2,
        y+height/2,
        height*.08,
        0,
        Math.PI*2
    );

    ctx.fill();

    ctx.restore();
}

const TOTAL=120;


/* =====================================================
   رسم كل مشهد
===================================================== */

function renderScene(t){

    const sceneIndex =
        scenes.findIndex(
            s =>
            t>=s.start &&
            t<s.end
        );

    const index =
        sceneIndex<0
        ? scenes.length-1
        : sceneIndex;

    const s =
        scenes[index];

    const p =
        clamp(
            (t-s.start)/
            (s.end-s.start),
            0,
            1
        );


    /* خلفية */

    ctx.clearRect(
        0,
        0,
        W,
        H
    );


    /* =========================================
       المشهد 0
    ========================================= */

    if(index===0){

        drawSky(
            "#020304",
            "#020304"
        );

    }


    /* =========================================
       المشهد 1
    ========================================= */

    if(index===1){

        drawSky(
            "#071018",
            "#172329"
        );

        drawStars(t);

        drawMap(
            t,
            p
        );

        /* نبض زمني */

        const glow =
            .035+
            Math.sin(t*.8)*.015;

        ctx.fillStyle =
            `rgba(220,190,110,${glow})`;

        ctx.fillRect(
            0,
            0,
            W,
            H
        );
    }


    /* =========================================
       المشهد 2
    ========================================= */

    if(index===2){

        drawSky(
            "#b66b4b",
            "#2b2722"
        );

        drawSun(
            W*.72,
            H*.3,
            H*.32,
            .65
        );

        /* الأرض */

        ctx.fillStyle =
            "#26261f";

        ctx.fillRect(
            0,
            H*.58,
            W,
            H*.42
        );

        /* طائرات بعيدة */

        for(let i=0;i<7;i++){

            const x =
                W*.05+
                i*W*.15+
                Math.sin(
                    t*.003+i
                )*15;

            const y =
                H*.27+
                Math.sin(
                    t*.004+i
                )*18;

            plane(
                x,
                y,
                .12+
                i*.008,
                -.04
            );
        }

        /* لحظة ضوء */

        const pulse =
            Math.max(
                0,
                Math.sin(t*.018)
            )*.16;

        flash(pulse);
    }


    /* =========================================
       المشهد 3
    ========================================= */

    if(index===3){

        drawCanal(t);

        /* قارب 1 */

        drawBoat(
            W*.44+
            Math.sin(t*.002)*15,
            H*.57,
            .62,
            1
        );

        /* قارب 2 */

        drawBoat(
            W*.56-
            Math.sin(t*.0017)*20,
            H*.65,
            .95,
            -1
        );

        /* قارب 3 */

        drawBoat(
            W*.49+
            Math.sin(t*.001)*30,
            H*.76,
            1.35,
            1
        );

        /* silhouettes */

        for(let i=0;i<12;i++){

            const q=i/11;

            const x =
                W*.43+
                q*W*.14;

            const y =
                H*.49+
                q*H*.04;

            ctx.fillStyle =
                "rgba(12,17,16,.8)";

            ctx.beginPath();

            ctx.arc(
                x,
                y,
                3+q*3,
                0,
                Math.PI*2
            );

            ctx.fill();

            ctx.fillRect(
                x-2,
                y,
                4,
                10+q*6
            );
        }

        /* حركة كاميرا وهمية */

        ctx.save();

        ctx.globalAlpha =
            between(p,.15,.75)*.13;

        ctx.strokeStyle =
            "#fff1c4";

        ctx.lineWidth=2;

        ctx.beginPath();

        ctx.moveTo(
            W*.5,
            H*.45
        );

        ctx.lineTo(
            W*.5,
            H*.82
        );

        ctx.stroke();

        ctx.restore();
    }


    /* =========================================
       المشهد 4
    ========================================= */

    if(index===4){

        drawSky(
            "#704b3d",
            "#20221e"
        );

        drawSun(
            W*.57,
            H*.31,
            H*.28,
            .25
        );

        drawFortification();

        /* مواقع دفاعية بعيدة */

        for(let i=0;i<6;i++){

            const x =
                W*.1+
                i*W*.16;

            const y =
                H*.48+
                Math.sin(i)*5;

            ctx.fillStyle =
                "#34362b";

            ctx.fillRect(
                x,
                y,
                60,
                32
            );

            ctx.fillStyle =
                "#24251f";

            ctx.fillRect(
                x+10,
                y-18,
                40,
                20
            );
        }

        drawSmoke(
            t,
            1
        );

        drawDust(
            t,
            1.3
        );

        const light =
            Math.max(
                0,
                Math.sin(
                    t*.014
                )
            )*.12;

        flash(light);
    }


    /* =========================================
       المشهد 5
    ========================================= */

    if(index===5){

        drawSky(
            "#7b5442",
            "#29271f"
        );

        drawSun(
            W*.6,
            H*.3,
            H*.3,
            .3
        );

        /* قناة في الأفق */

        ctx.fillStyle =
            "#3a5b5e";

        ctx.fillRect(
            0,
            H*.43,
            W,
            25
        );

        /* الكباري */

        for(let i=0;i<3;i++){

            const y =
                H*.47+
                i*H*.1;

            ctx.strokeStyle =
                "rgba(80,80,68,.9)";

            ctx.lineWidth=8;

            ctx.beginPath();

            ctx.moveTo(
                W*.12,
                y
            );

            ctx.lineTo(
                W*.88,
                y
            );

            ctx.stroke();
        }

        /* تدفق القوات بشكل رمزي */

        for(let i=0;i<15;i++){

            const q=i/14;

            const x =
                W*.06+
                q*W*.88;

            const y =
                H*.58+
                q*H*.27;

            const size =
                .08+
                q*.55;

            ctx.fillStyle =
                "rgba(25,28,23,.9)";

            ctx.beginPath();

            ctx.ellipse(
                x,
                y,
                34*size,
                11*size,
                0,
                0,
                Math.PI*2
            );

            ctx.fill();

            ctx.fillRect(
                x-20*size,
                y-10*size,
                40*size,
                10*size
            );
        }

        drawDust(
            t,
            1.6
        );

        drawSmoke(
            t,
            1.2
        );
    }


    /* =========================================
       المشهد 6
    ========================================= */

    if(index===6){

        const phase =
            Math.floor(p*4);

        if(phase%2===0){

            drawSky(
                "#526067",
                "#252b2b"
            );

            drawSun(
                W*.67,
                H*.27,
                H*.27,
                .2
            );

            ctx.fillStyle =
                "#3c3d34";

            ctx.fillRect(
                0,
                H*.56,
                W,
                H*.44
            );

            drawSmoke(
                t,
                1.3
            );

            drawDust(
                t,
                1.1
            );

        }else{

            drawMap(
                t,
                (p*4)%1
            );
        }
    }


    /* =========================================
       المشهد 7
    ========================================= */

    if(index===7){

        drawSky(
            "#b26f4e",
            "#151a1a"
        );

        drawSun(
            W*.5,
            H*.4,
            H*.32,
            .55
        );

        /* مياه هادئة */

        ctx.fillStyle =
            "#1d3a40";

        ctx.fillRect(
            0,
            H*.56,
            W,
            H*.44
        );

        for(let i=0;i<80;i++){

            const y =
                H*.58+
                i*H*.005;

            const width =
                30+i*4;

            ctx.strokeStyle =
                "rgba(220,200,150,.08)";

            ctx.beginPath();

            ctx.moveTo(
                W/2-width,
                y
            );

            ctx.lineTo(
                W/2+width,
                y
            );

            ctx.stroke();
        }

        drawFlag(
            t,
            between(
                p,
                .1,
                .65
            )
        );
    }


    /* =========================================
       المشهد 8
    ========================================= */

    if(index===8){

        ctx.fillStyle="#000";

        ctx.fillRect(
            0,
            0,
            W,
            H
        );
    }


    /* =========================================
       الانتقالات
    ========================================= */

    if(p<.12){

        const alpha =
            1-p/.12;

        ctx.fillStyle =
            `rgba(0,0,0,${alpha})`;

        ctx.fillRect(
            0,
            0,
            W,
            H
        );
    }

    if(p>.9){

        const alpha =
            (p-.9)/.1;

        ctx.fillStyle =
            `rgba(0,0,0,${alpha*.65})`;

        ctx.fillRect(
            0,
            0,
            W,
            H
        );
    }


    /* =========================================
       النص
    ========================================= */

    const caption =
        document.getElementById(
            "caption"
        );

    if(
        s.title &&
        index!==8
    ){

        caption.style.opacity="1";

        document.getElementById(
            "captionDate"
        ).textContent =
            s.date;

        document.getElementById(
            "captionTitle"
        ).textContent =
            s.title;

        document.getElementById(
            "captionText"
        ).textContent =
            s.text;

    }else{

        caption.style.opacity="0";
    }


    /* =========================================
       الشريط
    ========================================= */

    document.getElementById(
        "progressBar"
    ).style.width =
        (
            clamp(
                t/TOTAL,
                0,
                1
            )*100
        )+"%";
}


/* =====================================================
   الأحداث الصوتية
===================================================== */

let lastScene=-1;

function checkSound(t){

    const index =
        scenes.findIndex(
            s =>
            t>=s.start &&
            t<s.end
        );

    if(index===lastScene)
        return;

    lastScene=index;

    if(index===2){

        whoosh();

        setTimeout(
            boom,
            900
        );
    }

    if(index===3){

        waterSound();
    }

    if(index===4){

        boom();
    }

    if(index===5){

        whoosh();

        setTimeout(
            boom,
            800
        );
    }

    if(index===7){

        playTone(
            65,
            3,
            .04,
            "triangle"
        );
    }
}


/* =====================================================
   التشغيل
===================================================== */

let playing=false;
let startTime=0;

function animate(now){

    if(!playing)
        return;

    const elapsed =
        (now-startTime)/1000;

    renderScene(
        elapsed
    );

    checkSound(
        elapsed
    );

    if(elapsed>=TOTAL){

        playing=false;

        document.getElementById(
            "end"
        ).style.opacity="1";

        return;
    }

    requestAnimationFrame(
        animate
    );
}

).addEventListener(

        setTimeout(
            function(){

                document.getElementById(
                    "intro"
                ).style.display="none";

        );

        requestAnimationFrame(
            animate
        );
    }
);
